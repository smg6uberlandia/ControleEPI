      var tipoSel=document.getElementById("ew_tipo");
      if(tipoSel){tipoSel.value="";lock(tipoSel);}
      if(tipoWrap)tipoWrap.style.display="none";
      lockFromTamanho();
    }
    function lockFromTamanho(){
      if(ts){ts.innerHTML='<option value="">&#8212;</option>';lock(ts);}
      if(disp)disp.value="\u2014";
      lockFromQtdMotivo();
    }
    function lockFromQtdMotivo(){
      lock(qs);lock(ms);lock(os_);lock(addBtn);
      if(ms)ms.value="";
    }

    // Refresh collaborator datalist based on selected unit/shift
    function _refreshColabList(){
      var dl=document.getElementById("ew_colab_list");
      if(!dl)return;
      var uval=eu?eu.value:"";
      var unidade="",turno="";
      if(uval==="SMG6_AM"){unidade="SMG6";turno="AM";}
      else if(uval==="SMG6_PM"){unidade="SMG6";turno="PM";}
      else if(uval==="XMG2"){unidade="XMG2";}
      var list=unidade?colabListaAtivos("safety",unidade,turno||null):colabListaAtivos("safety");
      dl.innerHTML="";
      list.forEach(function(n){dl.innerHTML+='<option value="'+esc(n)+'"></option>';});
      // Clear colab input when unit changes (unless typed value still valid)
      if(cp){var cur=cp.value;if(cur&&!list.includes(cur))cp.value="";}
    }
    function _fillExtra(nome){
      var co=nome?COLABORADORES.find(function(x){return (x.nome||"").toLowerCase()===nome.toLowerCase();}):null;
      if(fu){fu.value=co&&co.funcao?co.funcao:"";fu.disabled=!nome;if(nome)fu.classList.remove("field-locked");}
      if(ad){ad.value=co&&co.admissao?String(co.admissao).slice(0,10):"";ad.disabled=!nome;if(nome)ad.classList.remove("field-locked");}
    }
    if(eu)eu.onchange=function(){
      _cpLastNome="";_fillExtra("");
      if(cp)cp.value="";
      lockFromProduto();
      if(eu.value){
        _refreshColabList();
        unlock(cp);
      } else {
        lock(cp);
      }
      chk();
    };
    // Estado inicial: unidade ainda n\u00e3o selecionada \u2192 colaborador travado
    lock(cp);

    // Retorna tamanhos que aparecem em entradas de um produto+cor, ou todos se nenhum entrada
    function tamsPorTipo(pr,corSel){
      if(!pr||!pr.tamanhos||!pr.tamanhos.length)return[];
      if(!corSel)return pr.tamanhos;
      var entradas=MOVS.filter(function(m){
        return m.produtoId===pr.id&&m.tipo==="entrada"&&(m.cor||"")===(corSel||"")&&m.tamanho;
      });
      if(!entradas.length)return pr.tamanhos; // sem dados: mostra todos
      var found=[...new Set(entradas.map(function(m){return String(m.tamanho).trim();}))];
      // Mant\u00e9m a ordem original de pr.tamanhos
      return pr.tamanhos.filter(function(t){return found.includes(String(t).trim());});
    }
    // Verifica se tipos t\u00eam conjuntos de tamanhos diferentes \u2192 tipo obrigat\u00f3rio
    function tiposComTamsDiferentes(pr){
      if(!pr||!pr.cores||pr.cores.length<2)return false;
      var sets=pr.cores.map(function(cor){
        return tamsPorTipo(pr,cor).join(",");
      });
      return sets.some(function(s){return s!==sets[0];});
    }
    function fillTams(pr,corSel){
      ts.innerHTML='<option value="">&#8212;</option>';
      if(!pr||!pr.tamanhos||!pr.tamanhos.length)return;
      var tams=tamsPorTipo(pr,corSel);
      tams.forEach(function(t){ts.innerHTML+='<option>'+esc(t)+'</option>';});
      // N\u00e3o pr\u00e9-seleciona nenhum tamanho \u2014 usu\u00e1rio deve escolher explicitamente
    }
    function fill(){
      var pr=PRODUTOS.find(function(x){return x.id===ps.value;});
      lockFromTipo(); // reseta tudo depois do produto sempre que ele muda
      if(!pr){return;}
      // Preencher campo Tipo/Modelo se o produto tiver cores/tipos cadastrados
      var tipoWrap=document.getElementById("ew_tipo_wrap");
      var tipoSel=document.getElementById("ew_tipo");
      var tipoLbl=tipoWrap?tipoWrap.querySelector("label"):null;
      if(tipoSel){
        tipoSel.innerHTML='<option value="">\u2014 selecione \u2014</option>';
        if(pr.cores&&pr.cores.length){
          pr.cores.forEach(function(cor){tipoSel.innerHTML+='<option>'+esc(cor)+'</option>';});
          if(tipoWrap)tipoWrap.style.display="";
          unlock(tipoSel);
          // Marca como obrigat\u00f3rio se tipos t\u00eam tamanhos diferentes (ou sempre \u2014 precisa ser escolhido antes do tamanho)
          var req=tiposComTamsDiferentes(pr);
          if(tipoLbl){
            tipoLbl.innerHTML="4&#65039;&#8419; "+'Tipo / Modelo <span class="req">*</span>'+(req?' <span style="font-size:9px;color:var(--txt-faint)">(tamanhos variam por tipo)</span>':'');
          }
          tipoSel._tipoObrigatorio=true; // sempre obrigat\u00f3rio selecionar antes do tamanho
        }else{
          if(tipoWrap)tipoWrap.style.display="none";
          if(tipoSel)tipoSel._tipoObrigatorio=false;
          // Sem tipo/cor \u2014 libera tamanho direto (se houver) ou qtd/motivo
          if(pr.tamanhos&&pr.tamanhos.length){
            fillTams(pr,"");
            unlock(ts);
          }else{
            unlock(qs);unlock(ms);unlock(os_);unlock(addBtn);
          }
        }
      }
      upd();
    }
    function upd(){
      var pr=PRODUTOS.find(function(x){return x.id===ps.value;});
      if(!pr){disp.value="\u2014";chk();return;}
      // Se produto tem tamanhos, mostra saldo do tamanho selecionado
      // Se nenhum tamanho selecionado, mostra o saldo total do produto
      if(pr.tamanhos&&pr.tamanhos.length){
        var tamSel=ts?ts.value:"";
        var tipoEl=document.getElementById("ew_tipo");
        var corSel=tipoEl?tipoEl.value:"";
        disp.value=tamSel?saldoVar(pr.id,tamSel,corSel):"\u2014";
      }else{
        var tipoEl2=document.getElementById("ew_tipo");
        var corSel2=tipoEl2?tipoEl2.value:"";
        disp.value=corSel2?saldoVar(pr.id,"",corSel2):atual(pr.id);
      }
      chk();
    }
    function chk(){
      var box=document.getElementById("movAlert");
      if(!box)return;
      box.innerHTML="";
      var pr=PRODUTOS.find(function(x){return x.id===ps.value;});
      var parte=(cp?cp.value:"").trim(), data=da?da.value:"";
      if(!pr||!parte)return;
      var prev=MOVS.filter(function(m){
        return m.tipo==="saida"&&m.produtoId===pr.id&&m.parte.trim().toLowerCase()===parte.toLowerCase()&&m.data<=data;
      }).sort(function(a,b){return b.data>a.data?1:-1;})[0];
      if(prev){
        var dd=days(prev.data,data);
        if(dd>=0&&dd<ALERTA_DIAS){
          var tm=prev.tamanho?", tam. "+esc(prev.tamanho):"";
          box.innerHTML='<div class="alert-line">&#9888;&#65039; <b>Entrega recente.</b> '+esc(parte)+' j&aacute; recebeu <b>'+esc(pr.descricao)+'</b> em <b>'+fmtD(prev.data)+'</b> (h&aacute; '+dd+' dia'+(dd===1?"":"s")+tm+'). Intervalo inferior a '+ALERTA_DIAS+' dias.</div>';
        }
      }
    }
    if(ps)ps.onchange=fill;
    if(ts)ts.onchange=function(){
      upd();
      if(ts.value){unlock(qs);unlock(ms);unlock(os_);unlock(addBtn);}
      else{lock(qs);lock(ms);lock(os_);lock(addBtn);}
    };
    var ewTipo=document.getElementById("ew_tipo");
    if(ewTipo)ewTipo.onchange=function(){
      var pr=PRODUTOS.find(function(x){return x.id===ps.value;});
      lockFromTamanho();
      if(!ewTipo.value)return; // ainda n\u00e3o escolheu o tipo \u2014 mant\u00e9m tudo travado
      fillTams(pr,ewTipo.value);
      if(pr&&pr.tamanhos&&pr.tamanhos.length){
        unlock(ts);
      }else{
        unlock(qs);unlock(ms);unlock(os_);unlock(addBtn);
      }
      upd();
    };
    if(cp){
      var _cpLastNome=""; // rastreia o \u00faltimo valor "efetivo" para saber se realmente mudou
      cp.oninput=function(){chk();}; // leve: s\u00f3 o alerta de retirada recente, roda a cada tecla
      cp.onchange=function(){
        chk();
        var colabNome=cp.value.trim();
        if(colabNome===_cpLastNome)return; // mesmo colaborador \u2014 n\u00e3o reseta a cadeia
        _cpLastNome=colabNome;
        _fillExtra(colabNome);
        // Mudou o colaborador de fato \u2014 sempre retrava Produto e tudo depois (reinicia a cadeia)
        lockFromProduto();
        if(!colabNome){return;}
        // Filter product list by collaborator gender
        var colabGenero=colabGeneroOf(colabNome);
        if(ps){
          ps.innerHTML='<option value="">\u2014 selecione \u2014</option>';
          prods.forEach(function(p){
            var pg=p.genero||"Unissex";
            if(!colabGenero||pg==="Unissex"||pg===colabGenero){
              ps.innerHTML+='<option value="'+p.id+'">'+esc(p.descricao)+'</option>';
            }
          });
          unlock(ps);
        }
      };
    }
    if(da)da.onchange=chk;
    // Estado inicial: tudo travado at\u00e9 a Unidade ser escolhida (sem pr\u00e9-sele\u00e7\u00e3o)
    lockFromProduto();
  },0);
}

/* \u2500\u2500 Lista de itens do wizard (renderiza dentro do modal aberto) \u2500\u2500 */
function _wz_renderListaItens(){
  var cont=document.getElementById("ew_lista_itens");
  if(!cont)return;
  if(!EPI_WZ.itens||!EPI_WZ.itens.length){
    cont.innerHTML='<span style="color:var(--txt-faint);font-size:12px">Nenhum EPI adicionado ainda. Use o formul\u00e1rio abaixo.</span>';
    return;
  }
  var html='';
  EPI_WZ.itens.forEach(function(it,idx){
    var tam=it.tam?'<span class="chip tam" style="margin-left:4px">'+esc(it.tam)+'</span>':'';
    var tipo=it.tipoModelo?'<span class="chip" style="margin-left:4px">'+esc(it.tipoModelo)+'</span>':'';
    var mot=it.motivo?'<span style="color:var(--txt-faint);font-size:10.5px;margin-left:6px">'+esc(it.motivo)+'</span>':'';
    html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line-soft)">'
      +'<span style="flex:1;font-size:12.5px"><b>'+esc(it.descricao)+'</b>'+tam+tipo
      +' <span style="color:var(--txt-dim);font-weight:700">\u00d7'+it.qtd+'</span>'+mot+'</span>'
      +'<button type="button" class="btn ghost sm" style="font-size:11px;padding:2px 7px;color:var(--red);min-width:0" onclick="_wz_removerItem('+idx+')">\u2715</button>'
      +'</div>';
  });
  cont.innerHTML=html;
}

function _wz_adicionarItem(){
  var prod=((document.getElementById("ew_prod")||{}).value)||"";
  var qtd=Number(((document.getElementById("ew_qtd")||{}).value)||0);
  var tam=((document.getElementById("ew_tam")||{}).value)||"";
  var obs=((document.getElementById("ew_obs")||{}).value)||"";
  var motivo=((document.getElementById("ew_motivo")||{}).value)||"";
  var tipoModelo=((document.getElementById("ew_tipo")||{}).value)||"";
  var p=PRODUTOS.find(function(x){return x.id===prod;});
  if(!prod){toast("Selecione um EPI","erro");return;}
  if(p&&p.cores&&p.cores.length&&!tipoModelo){toast("Selecione o Tipo / Modelo","erro");return;}
  if(p&&p.tamanhos&&p.tamanhos.length&&!tam){toast("Selecione o tamanho","erro");return;}
  if(!qtd||qtd<=0){toast("Informe a quantidade","erro");return;}
  if(!motivo){toast("Selecione o motivo","erro");return;}
  // Calcula qtd j\u00e1 na lista para esse produto+tamanho+tipo (mesma combina\u00e7\u00e3o exata)
  var qtdNaLista=EPI_WZ.itens.filter(function(it){return it.prod===prod&&it.tam===tam&&it.tipoModelo===tipoModelo;}).reduce(function(s,it){return s+it.qtd;},0);
  // Saldo considera Tipo/Modelo espec\u00edfico (evita contagem agregada incorreta entre tipos diferentes)
  var saldo=tam?saldoVar(prod,tam,tipoModelo):(tipoModelo?saldoVar(prod,"",tipoModelo):atual(prod));
  if(qtdNaLista+qtd>saldo){toast("Estoque insuficiente"+(tam?" (tam. "+tam+")":"")+(tipoModelo?" ("+tipoModelo+")":"")+". Dispon\u00edvel: "+saldo+" \u00b7 Na lista: "+qtdNaLista+".","erro");return;}
  // Agrupa com item igual se existir
  var existente=EPI_WZ.itens.find(function(it){return it.prod===prod&&it.tam===tam&&it.tipoModelo===tipoModelo&&it.motivo===motivo;});
  if(existente){
    existente.qtd+=qtd;
    if(obs)existente.obs=(existente.obs?existente.obs+" / ":"")+obs;
  }else{
    EPI_WZ.itens.push({prod:prod,descricao:p?p.descricao:prod,tam:tam,qtd:qtd,obs:obs,motivo:motivo,tipoModelo:tipoModelo});
  }
  // Limpa campos de produto para facilitar pr\u00f3xima adi\u00e7\u00e3o (Colaborador permanece selecionado)
  var ps=document.getElementById("ew_prod"),ts=document.getElementById("ew_tam"),
      ms=document.getElementById("ew_motivo"),qs=document.getElementById("ew_qtd"),
      os=document.getElementById("ew_obs"),disp=document.getElementById("ew_disp"),
      tipoSel=document.getElementById("ew_tipo"),addBtn=document.getElementById("ew_add_btn");
  if(ps)ps.value="";
  if(tipoSel){tipoSel.value="";tipoSel.disabled=true;tipoSel.classList.add("field-locked");}
  if(ts){ts.innerHTML='<option value="">&#8212;</option>';ts.disabled=true;ts.classList.add("field-locked");}
  if(ms){ms.value="";ms.disabled=true;ms.classList.add("field-locked");}
  if(qs){qs.value="1";qs.disabled=true;qs.classList.add("field-locked");}
  if(os){os.value="";os.disabled=true;os.classList.add("field-locked");}
  if(addBtn){addBtn.disabled=true;addBtn.classList.add("field-locked");}
  if(disp)disp.value="\u2014";
  var tw=document.getElementById("ew_tipo_wrap");if(tw)tw.style.display="none";
  _wz_renderListaItens();
  toast((p?p.descricao:prod)+" adicionado \u00e0 lista","ok");
}

function _wz_removerItem(idx){
  EPI_WZ.itens.splice(idx,1);
  _wz_renderListaItens();
}


function _wz_voltarStep1(){
  _wz_pararCamera();
  var prods=prodOf("safety").slice().sort(function(a,b){return a.descricao.localeCompare(b.descricao,"pt-BR");});
  var d=EPI_WZ.dados||{};
  _wz_step1(prods,"");
  // Restaura o que ja foi preenchido (a lista de EPIs fica em EPI_WZ.itens)
  setTimeout(function(){
    var da=document.getElementById("ew_data");if(da&&d.data)da.value=d.data;
    var eu=document.getElementById("ew_unidade");
    if(eu&&d.unidade){eu.value=d.unidade;if(eu.onchange)eu.onchange();}
    var cp=document.getElementById("ew_colab");
    if(cp&&d.colab&&!cp.disabled){cp.value=d.colab;if(cp.onchange)cp.onchange();}

  },60);
}
function _wz_validarDados(){
  var colab=(document.getElementById("ew_colab")||{}).value||"";
  colab=colab.trim();
  var lib=((document.getElementById("ew_lib")||{}).value||"").trim();
  var data=((document.getElementById("ew_data")||{}).value)||"";
  var _unidSel=((document.getElementById("ew_unidade")||{}).value)||"";
  var funcao=((document.getElementById("ew_funcao")||{}).value||"").trim();
  var admissao=((document.getElementById("ew_admissao")||{}).value||"").trim();
  if(!lib){var _cu2=getUser();lib=_cu2?(_cu2.nome||_cu2.email||""):"Sistema";}
  if(!colab||!data){toast("Preencha Colaborador e Data","erro");return;}
  // Validate collaborator name exists (may be typed)
  var _colabNormLC=colab.toLowerCase();
  var _colabMatch=COLABORADORES.find(function(x){return (x.nome||"").toLowerCase()===_colabNormLC;})
    ||COLAB_PLANILHA_ATIVOS.find(function(n){return n.toLowerCase()===_colabNormLC;});
  if(!_colabMatch){toast("Colaborador n\u00e3o encontrado. Verifique o nome digitado.","erro");return;}
  // Use canonical name from record
  colab=_colabMatch.nome||_colabMatch||colab;
  if(!funcao){toast("Informe a Fun\u00e7\u00e3o do colaborador","erro");return;}
  if(!admissao){toast("Informe a Data de admiss\u00e3o do colaborador","erro");return;}
  // Grava fun\u00e7\u00e3o/admiss\u00e3o no cadastro quando novos ou alterados
  var _coCad=COLABORADORES.find(function(x){return x.nome===colab;});
  if(_coCad&&(_coCad.funcao!==funcao||String(_coCad.admissao||"").slice(0,10)!==admissao)){
    _coCad.funcao=funcao;_coCad.admissao=admissao;
    colabCacheSave(_coCad);
    api("saveColaborador",{colaborador:_coCad,isNew:false,oldNome:_coCad.nome},true).then(function(r){
      if(!r||!r.ok)toast("Aviso: n\u00e3o foi poss\u00edvel gravar fun\u00e7\u00e3o/admiss\u00e3o no cadastro.","warn");
    });
  }
  if(!EPI_WZ.itens||!EPI_WZ.itens.length){toast("Adicione pelo menos um EPI \u00e0 lista antes de continuar","erro");return;}
  // Preenche dados de cabe\u00e7alho + copia primeiro item p/ compatibilidade com etapas 2-4
  var fi=EPI_WZ.itens[0];
  EPI_WZ.dados={colab:colab,lib:lib,data:data,unidade:_unidSel,funcao:funcao,admissao:admissao,
    prod:fi.prod,qtd:fi.qtd,tam:fi.tam,obs:fi.obs,motivo:fi.motivo,tipoModelo:fi.tipoModelo};
  // CPF lookup (sem etapa de confirma\u00e7\u00e3o \u2014 busca direto do cadastro)
  var _colabCpf=COLABORADORES.find(function(c){return c.nome===colab;});
  EPI_WZ._cpfColab=_colabCpf?_colabCpf.cpf||null:null;
  _wz_step3();
}

/* \u2500\u2500 ETAPA 2 \u00b7 CPF (desativada \u2014 CPF vem do cadastro automaticamente) \u2500\u2500 */
function _wz_step2(){
  var nome=EPI_WZ.dados.colab;
  EPI_WZ._cpfColab=null;
  var colabObj=COLABORADORES.find(function(c){return c.nome===nome;});
  EPI_WZ._cpfColab=colabObj?colabObj.cpf||null:null;
  var cpfCad=EPI_WZ._cpfColab;
  var body=_wz_steps(2)
    +'<div style="text-align:center;padding:8px 0 16px">'
    +'<div style="font-size:18px;font-weight:800;font-family:var(--disp)">'+esc(nome)+'</div>'
    +(cpfCad
      ?'<div style="font-size:12px;color:var(--txt-dim);margin-top:4px">Digite o CPF para confirmar a identidade</div>'
      :'<div style="font-size:12px;color:var(--amber);margin-top:4px">\u26a0 CPF n\u00e3o cadastrado. Cadastre o colaborador primeiro.</div>'
    )
    +'</div>'
    +'<div style="display:flex;flex-direction:column;align-items:center;gap:12px">'
    +'<input id="wz_cpf" type="text" inputmode="numeric" maxlength="14" autocomplete="off" '
    +'style="font-size:20px;letter-spacing:2px;text-align:center;width:100%;max-width:340px;box-sizing:border-box;border:2px solid var(--line);'
    +'border-radius:10px;padding:14px 12px;font-family:var(--mono)" placeholder="000.000.000-00">'
    +'<div id="cpf_err" style="color:var(--red);font-size:12px;min-height:16px"></div>'
    +'</div>';
  openModal("Nova Entrega de EPI \u2014 Etapa 2 de 4",body,[
    {label:"\u2190 Voltar",cls:"ghost",act:function(){
      _wz_step1(prodOf("safety").slice().sort(function(a,b){return a.descricao.localeCompare(b.descricao,"pt-BR");}),EPI_WZ.dados.colab);
    }},
    {label:"Pr\u00f3ximo: Foto \u2192",cls:"primary",act:_wz_validarCPF}
  ]);
  setTimeout(function(){
    var ci=document.getElementById("wz_cpf");
    if(ci){
      ci.focus();
      ci.addEventListener("input",function(){
        var v=ci.value.replace(/\D/g,'').slice(0,11);
        if(v.length>9)ci.value=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
        else if(v.length>6)ci.value=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
        else if(v.length>3)ci.value=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
        else ci.value=v;
      });
      ci.addEventListener("keydown",function(e){if(e.key==="Enter")_wz_validarCPF();});
    }
  },100);
}


function _wz_validarCPF(){
  var cpfEl=document.getElementById("wz_cpf");
  var cpfDigit=(cpfEl?cpfEl.value:"").replace(/\D/g,'');
  var err=document.getElementById("cpf_err");
  if(cpfDigit.length!==11){if(err)err.textContent="CPF deve ter 11 d\u00edgitos.";return;}
  var cpfCad=EPI_WZ._cpfColab?(EPI_WZ._cpfColab).replace(/\D/g,''):null;
  if(!cpfCad){
    if(err)err.textContent="CPF n\u00e3o cadastrado para este colaborador. Cadastre primeiro.";
    return;
  }
  if(cpfDigit!==cpfCad){
    if(err)err.textContent="CPF incorreto. Verifique e tente novamente.";
    if(cpfEl){cpfEl.value='';cpfEl.focus();}
    return;
  }
  _wz_step3();
}

function _wz_step3(){
  var body=_wz_steps(2)
    +'<div style="text-align:center">'
    +'<div style="font-size:13px;color:var(--txt-dim);margin-bottom:12px">Posicione o colaborador em frente \u00e0 c\u00e2mera e clique em <b>Capturar Foto</b>.</div>'

function _wz_capturarFoto(){
  var v=document.getElementById("wz_video"),c=document.getElementById("wz_canvas");

  c.getContext("2d").drawImage(v,0,0,c.width,c.height);

  // Ocultar v\u00eddeo imediatamente (evita tela preta ap\u00f3s parar a c\u00e2mera)
  if(v)v.style.display="none";
  var fi=document.getElementById("wz_foto_img");if(fi)fi.src=EPI_WZ.fotoDataUrl;
  var fp=document.getElementById("wz_foto_prev");if(fp)fp.style.display="block";
  var sb=document.getElementById("wz_snap_btn");if(sb)sb.style.display="none";
  var fb2=document.getElementById("wz_file_btn");if(fb2)fb2.style.display="none";
  var rc=document.getElementById("wz_recapture");if(rc)rc.style.display="inline-flex";

function _wz_fotoArquivo(inp){
  var file=inp&&inp.files&&inp.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=960,w=img.width,h=img.height;
      if(w>max||h>max){var r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      var c=document.getElementById("wz_canvas");if(!c)return;
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      EPI_WZ.fotoDataUrl=c.toDataURL("image/jpeg",0.85);
      _wz_pararCamera();
      var v=document.getElementById("wz_video");if(v)v.style.display="none";
      var fi=document.getElementById("wz_foto_img");if(fi)fi.src=EPI_WZ.fotoDataUrl;
      var fp=document.getElementById("wz_foto_prev");if(fp)fp.style.display="block";
      var sb=document.getElementById("wz_snap_btn");if(sb)sb.style.display="none";
      var fb=document.getElementById("wz_file_btn");if(fb)fb.style.display="none";
      var rc=document.getElementById("wz_recapture");if(rc)rc.style.display="inline-flex";
      var er=document.getElementById("cam_err");if(er)er.textContent="";
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
  inp.value="";
}

function _wz_initCanvas(){
  var canvas=document.getElementById("sig_canvas");if(!canvas)return;
  var rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=Math.max(rect.width-4,200);canvas.height=180;
  var ctx=canvas.getContext("2d");
  ctx.fillStyle="#fafbfd";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#1d2733";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";
  var drawing=false,lx=0,ly=0;
  function getPos(e){var r=canvas.getBoundingClientRect();var src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(canvas.width/r.width),y:(src.clientY-r.top)*(canvas.height/r.height)};}
  canvas.addEventListener("mousedown",function(e){drawing=true;var p=getPos(e);lx=p.x;ly=p.y;});
  canvas.addEventListener("mousemove",function(e){if(!drawing)return;var p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;});
  canvas.addEventListener("mouseup",function(){drawing=false;});
  canvas.addEventListener("mouseleave",function(){drawing=false;});
  canvas.addEventListener("touchstart",function(e){e.preventDefault();drawing=true;var p=getPos(e);lx=p.x;ly=p.y;},{passive:false});
  canvas.addEventListener("touchmove",function(e){e.preventDefault();if(!drawing)return;var p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;},{passive:false});
  canvas.addEventListener("touchend",function(){drawing=false;});
}
function _wz_limparAssinatura(){
  var c=document.getElementById("sig_canvas");if(!c)return;
  var ctx=c.getContext("2d");ctx.fillStyle="#fafbfd";ctx.fillRect(0,0,c.width,c.height);
  EPI_WZ.assinDataUrl=null;
}
function _wz_assinVazia(){
  var c=document.getElementById("sig_canvas");if(!c)return true;
  var d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;
  for(var i=0;i<d.length;i+=4){if(d[i]<240||d[i+1]<240||d[i+2]<240)return false;}
  return true;
}

async function _wz_finalizar(){
  if(_wz_assinVazia()){var err=document.getElementById("sig_err");if(err)err.textContent="Por favor, assine antes de confirmar.";return;}
  if(EPI_WZ._saving){return;} // guard contra duplo envio
  EPI_WZ._saving=true;
  // Desabilita bot\u00e3o para evitar duplo envio
  var _btnConf=document.querySelector(".modal-foot .btn.green");
  if(_btnConf){_btnConf.disabled=true;_btnConf.textContent="Salvando\u2026";}
  var c=document.getElementById("sig_canvas");
  EPI_WZ.assinDataUrl=c?c.toDataURL("image/png"):null;
  var d=EPI_WZ.dados;
  var colabObjFin=COLABORADORES.find(function(x){return x.nome===d.colab;});
  if(colabObjFin)d.cpf=colabObjFin.cpf||"";
  var fotoSnap=EPI_WZ.fotoDataUrl||null;
  var assinSnap=EPI_WZ.assinDataUrl||null;
  // Lista de itens (compatibilidade retroativa: se itens vazio, usa dados legado)
  var itensParaSalvar=EPI_WZ.itens&&EPI_WZ.itens.length
    ?EPI_WZ.itens
    :[{prod:d.prod,descricao:"",qtd:d.qtd,tam:d.tam,obs:d.obs,motivo:d.motivo,tipoModelo:d.tipoModelo}];
  var savedMovs=[];var firstMov=null;var _codEntrega="";
  for(var _i=0;_i<itensParaSalvar.length;_i++){
    var it=itensParaSalvar[_i];
    var p=PRODUTOS.find(function(x){return x.id===it.prod;});
    if(!p)continue;
    var movId=uid();
    if(!_codEntrega)_codEntrega=gerarCodigoValidacao(movId); // mesmo codigo para todos os itens da entrega
    var codigoValidacao=_codEntrega;
    var obsPersist=(it.motivo?("Motivo: "+it.motivo):"")
      +(it.obs?((it.motivo?" \u2014 ":"")+it.obs):"")
      +" [COD: "+codigoValidacao+"]";
    var wzMov={id:movId,_t:Date.now(),produtoId:p.id,dom:"safety",tipo:"saida",
      data:d.data,qtd:it.qtd,tamanho:it.tam||"",cor:it.tipoModelo||"",
      parte:d.colab,liberadoPor:d.lib,obs:obsPersist,
      motivo:it.motivo||"",codigo:codigoValidacao,tipoModelo:it.tipoModelo||"",
      temRecibo:(!firstMov),reciboRef:(firstMov?firstMov.id:null),
      fotoUrl:fotoSnap,assinUrl:assinSnap};
    var movPersist=Object.assign({},wzMov);delete movPersist.fotoUrl;delete movPersist.assinUrl;
    const r_w=await persistMov(movPersist);
    if(!r_w){toast("Erro ao salvar "+p.descricao,"erro");continue;}
    MOVS.push(wzMov);
    savedMovs.push({mov:wzMov,p:p,it:it,codigo:codigoValidacao});
    if(!firstMov)firstMov=wzMov;
  }
  if(!savedMovs.length){
    toast("Nenhum item p\u00f4de ser salvo.","erro");
    EPI_WZ._saving=false;
    var _btnConf2=document.querySelector(".modal-foot .btn.green");
    if(_btnConf2){_btnConf2.disabled=false;_btnConf2.textContent="\u2713 Confirmar e Gerar Comprovante";}
    return;
  }
  EPI_WZ._saving=false;
  closeModal();
  toast(savedMovs.length===1
    ?"Entrega registrada: "+savedMovs[0].it.qtd+"\u00d7 "+savedMovs[0].p.descricao+" \u2192 "+d.colab
    :"Entrega registrada: "+savedMovs.length+" EPIs \u2192 "+d.colab
  ,"ok");
  // Gera PDF com todos os itens
  var itensPDF=itensParaSalvar.map(function(it,i){
    var pp=PRODUTOS.find(function(x){return x.id===it.prod;})||{descricao:it.descricao||"",unidade:"UN"};
    return Object.assign({},it,{descricao:pp.descricao,unidade:pp.unidade||"UN",
      ca:caAtualProduto(pp.id),codigo:savedMovs[i]?savedMovs[i].codigo:""});
  });
  var dParaPDF=Object.assign({},d,{itens:itensPDF,codigo:savedMovs.length?savedMovs[0].codigo:""});
  var reciboHtml=await _wz_gerarPDF(dParaPDF,savedMovs[0].p,fotoSnap,assinSnap);
  if(firstMov)salvarReciboDrive(firstMov,reciboHtml);
  state.dom="safety";state.view="colaboradores";state.colab=d.colab;render();
}

/* \u2500\u2500 Salva o comprovante como PDF no Drive (via backend) e grava reciboUrl \u2500\u2500 */
async function salvarReciboDrive(mov, html){
  if(!html){return;}
  try{
    driveSetStatus("syncing");
    var nomeArq='Comprovante_EPI_'+String(mov.parte||'').replace(/\s+/g,'_')+'_'+mov.data+'_'+Date.now();
    var body=JSON.stringify({
      action:"saveRecibo",
      token:getToken(),
      payload:{movId:mov.id,html:html,nomeArq:nomeArq,folderId:DRIVE_FOLDER_EPI}
    });
    // POST (no-cors) \u2014 o payload com foto/assinatura \u00e9 grande demais para JSONP/GET
    if(_hostedNoAppsScript()){
      await api("saveRecibo",{movId:mov.id,html:html,nomeArq:nomeArq,folderId:DRIVE_FOLDER_EPI},true);
    }else{
      await fetch(APPS_SCRIPT_URL,{
        method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:body
      });
    }
    // Recupera a URL gravada na planilha (o PDF leva alguns segundos para ser gerado)
    var url=await _pollRecibo(mov.id,6,2500);
    if(url){
      mov.reciboUrl=url;mov.temRecibo=true;
      driveSetStatus("ok");
      toast("Comprovante salvo no Drive \u2713","ok");
      if(state.view==="colaboradores")render();
    }else{
      driveSetStatus("ok");
      toast("Comprovante enviado ao Drive (processando). Atualize em instantes.","warn");
    }
  }catch(e){
    console.error("salvarReciboDrive:",e);
    driveSetStatus("error");
    toast("Falha ao salvar no Drive: "+e.message,"erro");
  }
}
async function _pollRecibo(movId,tries,delay){
  for(var i=0;i<tries;i++){
    await new Promise(function(r){setTimeout(r,delay);});
    var res=await api("getRecibo",{movId:movId},true);
    if(res&&res.ok&&res.url)return res.url;
  }
  return null;
}

async function reemitirRecibo(movId){
  var mv=MOVS.find(function(x){return x.id===movId;});
  if(!mv){toast("Movimenta\u00e7\u00e3o n\u00e3o encontrada","erro");return;}
  if(mv.reciboRef){reemitirRecibo(mv.reciboRef);return;}
  // 1) Se j\u00e1 existe o PDF salvo no Drive, abre direto
  if(mv.reciboUrl){_abrirPdfApp(mv);return;}
  // 2) Tenta buscar a URL no servidor (pode ter sido gerada em outra sess\u00e3o)
  var res=await api("getRecibo",{movId:movId},true);
  if(res&&res.ok&&res.url){mv.reciboUrl=res.url;_abrirPdfApp(mv);return;}
  // 3) Fallback: regenera localmente (s\u00f3 h\u00e1 foto/assinatura na sess\u00e3o em que foi criado)
  var p=PRODUTOS.find(function(x){return x.id===mv.produtoId;});
  if(!p){toast("Produto n\u00e3o encontrado","erro");return;}
  var colabObj=COLABORADORES.find(function(c){return c.nome===mv.parte;});
  // Recupera c\u00f3digo de valida\u00e7\u00e3o (campo local ou embutido em obs)
  var codigo=mv.codigo||"";
  if(!codigo&&mv.obs){var mcod=/\[COD:\s*([A-Z0-9\-]+)\]/i.exec(mv.obs);if(mcod)codigo=mcod[1];}
  // Recupera motivo (campo local ou embutido em obs)
  var motivo=mv.motivo||"";
  if(!motivo&&mv.obs){var mmot=/Motivo:\s*([^\u2014\[\n]+)/i.exec(mv.obs);if(mmot)motivo=mmot[1].trim();}
  var d={colab:mv.parte,prod:mv.produtoId,qtd:mv.qtd,lib:mv.liberadoPor||"",
    data:mv.data,tam:mv.tamanho||"",obs:mv.obs||"",
    cpf:colabObj?colabObj.cpf||"":"",funcao:colabObj?colabObj.funcao||"":"",admissao:colabObj?colabObj.admissao||"":"",ca:caAtualProduto(mv.produtoId),
    codigo:codigo,motivo:motivo};
  if(!mv.fotoUrl&&!mv.assinUrl){
    toast("PDF do Drive ainda n\u00e3o dispon\u00edvel \u2014 gerando comprovante a partir dos dados.","warn");
  }
  var html=await _wz_gerarPDF(d,p,mv.fotoUrl||null,mv.assinUrl||null);
  // Se ainda n\u00e3o h\u00e1 recibo salvo, tenta salvar agora no Drive
  if(html&&!mv.reciboUrl)salvarReciboDrive(mv,html);
}

  const ok=await confirmModal("Excluir registro","Remover esta movimenta\u00e7\u00e3o? O saldo ser\u00e1 recalculado.","Excluir");
  if(!ok)return;
  const r=await deleteMovApi(id);if(!r)return;
  MOVS=MOVS.filter(m=>m.id!==id);render();
}

function editMov(id){
  const mv=MOVS.find(m=>m.id===id);if(!mv||mv.tipo!=="entrada")return;
  const p=PRODUTOS.find(x=>x.id===mv.produtoId);if(!p)return;
  const tamOpts=(p.tamanhos&&p.tamanhos.length)?`<div class="mfield"><label>Tamanho</label><select id="em_tam">${p.tamanhos.map(t=>`<option ${mv.tamanho===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`:"";
  const corOpts=(p.cores&&p.cores.length)?`<div class="mfield"><label>Cor/Tipo</label><select id="em_cor">${p.cores.map(c=>`<option ${mv.cor===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:"";
  const body=`<div class="mgrid">
    <div class="mfield"><label>Data <span class="req">*</span></label><input type="date" id="em_data" value="${mv.data}"></div>
    <div class="mfield"><label>Fornecedor</label><input id="em_parte" value="${esc(mv.parte||"")}" placeholder="Fornecedor / origem"></div>
    ${tamOpts}${corOpts}
    <div class="mfield"><label>Quantidade <span class="req">*</span></label><input type="number" id="em_qtd" min="1" step="1" value="${mv.qtd}"></div>
    <div class="mfield"><label>Custo unit\u00e1rio (R$)</label><input type="number" id="em_cu" min="0" step="0.01" value="${mv.custoUnit||0}"></div>
    <div class="mfield"><label>Usu\u00e1rio</label><input id="em_user" value="${esc(mv.usuario||"")}"></div>
    <div class="mfield full"><label>Observa\u00e7\u00f5es</label><input id="em_obs" value="${esc(mv.obs||"")}"></div>
  </div>`;
  openModal("Editar Entrada \u00b7 "+esc(p.descricao),body,[
    {label:"Cancelar",cls:"ghost",act:closeModal},
    {label:"Salvar Altera\u00e7\u00f5es",cls:"primary",act:async()=>{
      const qtd=Number(document.getElementById("em_qtd")?.value);
      const data=document.getElementById("em_data")?.value;
      if(!data||!qtd||qtd<=0){toast("Informe data e quantidade","erro");return;}
      mv.data=data;mv.qtd=qtd;
      mv.parte=document.getElementById("em_parte")?.value.trim()||"\u2014";
      mv.custoUnit=Number(document.getElementById("em_cu")?.value)||0;
      mv.usuario=document.getElementById("em_user")?.value.trim()||"";
      mv.obs=document.getElementById("em_obs")?.value.trim()||"";
      if(p.tamanhos&&p.tamanhos.length){const t=document.getElementById("em_tam");if(t)mv.tamanho=t.value;}
      if(p.cores&&p.cores.length){const c=document.getElementById("em_cor");if(c)mv.cor=c.value;}
      await updateMovApi(mv);closeModal();toast("Entrada atualizada.","ok");render();
    }}
  ]);
}

/* \u2500\u2500 Auto-restore de sess\u00e3o \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Ao abrir/recarregar a p\u00e1gina (celular, notebook, refresh), se j\u00e1 h\u00e1 token
   no localStorage, tenta restaurar a sess\u00e3o sem exibir a tela de login.
   Se o servidor rejeitar o token (expirado), remove a sess\u00e3o e pede login. */
(function autoRestore(){
  var token = localStorage.getItem("smg6_token");
  var userJson = localStorage.getItem("smg6_user");
  if(!token || !userJson) return; // sem sess\u00e3o pr\u00e9via \u2014 fica na tela de login
  var user;
  try { user = JSON.parse(userJson); } catch(e){ return; }
  // Mostra o app imediatamente (evita flash da tela de login)
  var ls = document.getElementById("login-screen");
  var appEl = document.getElementById("app");
  if(ls) ls.style.display = "none";
  if(appEl) appEl.style.display = "";
  var saveEl = document.getElementById("save");
  if(saveEl) saveEl.textContent = user.nome || user.email || "";
  // Inicializa estado b\u00e1sico
  state.view = "estoque"; state.sel = null; state.colab = null;
  state.rep = state.rep || "semana";
  var yr = Number((today()||"2026").slice(0,4));
  if(!state.repYear) state.repYear = yr;
  if(!state.repWeek) state.repWeek = weekOfYear(today());
  if(!state.repMonth) state.repMonth = today().slice(0,7);
  if(!state.repStart) state.repStart = today().slice(0,8)+"01";
  if(!state.repEnd) state.repEnd = today();
  // Atualiza rel\u00f3gio
  if(typeof startClock==="function") startClock();
  // Carrega dados do servidor
  (async function(){
    try{
      var ok = await loadAll();
      if(!ok){
        // Servidor rejeitou token \u2014 pede login novamente
        localStorage.removeItem("smg6_token");
        localStorage.removeItem("smg6_user");
        if(appEl) appEl.style.display = "none";
        if(ls) ls.style.display = "flex";
        if(typeof showLogin==="function") showLogin();
        return;
      }
      try{ await loadPins(); }catch(e){}
      render();
      // Exibir/ocultar menu admin
      var menuAdmin = document.getElementById("menuUsuarios");
      if(menuAdmin) menuAdmin.style.display = (user.nivel==="admin") ? "" : "none";
    }catch(err){
      // Erro de rede: mant\u00e9m o app vis\u00edvel com os dados em cache (se houver)
      console.warn("autoRestore: erro ao carregar dados", err);
      render();
    }
  })();
})();

/* ================= NAVEGA\u00c7\u00c3O (menu superior + abas Safety/Insumos) =================
   Reconecta os cliques dos bot\u00f5es do menu (Estoque, Colaboradores, Desligados,
   Relat\u00f3rios) e das abas Safety/Insumos. Usa delega\u00e7\u00e3o de evento, ent\u00e3o funciona
   mesmo ap\u00f3s re-render do conte\u00fado. */
(function setupNav(){
  function bind(){
    var menu=document.getElementById("menu");
    if(menu && !menu._navBound){
      menu._navBound=true;
      menu.addEventListener("click",function(e){
        var b=e.target.closest("button[data-view]");
        if(!b || !menu.contains(b)) return;
        if(b.getAttribute("onclick")) return; /* ex.: Usu\u00e1rios trata sozinho */
        state.view=b.dataset.view;
        state.sel=null; state.colab=null; state.histColab=null;
        render();
      });
    }
    var tabs=document.querySelector(".dom-tabs");
    if(tabs && !tabs._navBound){
      tabs._navBound=true;
      tabs.addEventListener("click",function(e){
        var b=e.target.closest("button[data-dom]");
        if(!b || !tabs.contains(b)) return;
        state.dom=b.dataset.dom;
        state.sel=null; state.colab=null; state.histColab=null;
        render();
      });
    }
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",bind);
  }else{ bind(); }
})();
