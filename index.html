    +'.stat .v{font-size:20px;font-weight:800}.stat .l{font-size:9px;color:#888}'
    +'table{width:100%;border-collapse:collapse;margin-top:12px}'
    +'th{background:#2D3277;color:#fff;padding:6px 9px;font-size:10.5px;text-align:left}'
    +'td{padding:5px 9px;border-bottom:1px solid #eee}'
    +'@media print{button{display:none}}</style></head><body>'
    +'<button onclick="window.print()" style="margin-bottom:16px;padding:7px 14px;background:#2D3277;color:#fff;border:none;border-radius:6px;cursor:pointer">\ud83d\uddb8 Imprimir / PDF</button>'
    +'<h1>Relat\u00f3rio de Busca \u2014 Controle de Estoque SMG6/XMG2</h1>'
    +(q?'<h2>Busca: <b>'+esc(q)+'</b>'+(tam?' \u00b7 Tamanho: <b>'+esc(tam)+'</b>':'')+'</h2>':"")
    +'<h2>Per\u00edodo: <b>'+periodoLabel+'</b></h2>'
    +'<div class="stats">'
      +'<div class="stat"><div class="v" style="color:#c0392b">'+totalSai+'</div><div class="l">Sa\u00eddas</div></div>'
      +'<div class="stat"><div class="v" style="color:#1a7a45">'+totalEnt+'</div><div class="l">Entradas</div></div>'
      +'<div class="stat"><div class="v" style="color:#2D3277">'+movsFilt.length+'</div><div class="l">Registros</div></div>'
    +'</div>'
    +'<table><thead><tr><th>Data</th><th>Tipo</th><th>EPI</th><th>Tamanho</th><th>Cor/Tipo</th><th>Colaborador</th><th>Qtd</th><th>Liberado por</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'</body></html>';
  var blob=new Blob([html],{type:"text/html"});
  window.open(URL.createObjectURL(blob),"_blank");
}
function viewRel(){
  const dom=state.dom;
  const todayStr=today();
  const curYear=Number(todayStr.slice(0,4));
  if(!state.repYear)state.repYear=curYear;
  if(!state.repMonth)state.repMonth=todayStr.slice(0,7);

  let start,end,periodoLbl="",weekOptions="",wkLbl="";

  if(state.rep==="semana"){
    const wks=weeksInYear(state.repYear);
    const curW=weekOfYear(todayStr);
    const selW=state.repWeek||curW;
    const wkObj=wks.find(w=>w.w===selW)||wks[wks.length-1];
    start=wkObj.start;end=wkObj.end;wkLbl=wkObj.label;
    periodoLbl=`${wkObj.label} \u2014 ${fmtD(wkObj.start)} a ${fmtD(wkObj.end)}`;
    weekOptions=`<div class="fg"><label>Ano</label><input type="number" id="rep_year" value="${state.repYear}" min="2020" max="2100" style="width:100px"></div>
      <div class="fg"><label>Semana</label><select id="rep_week">${wks.map(w=>`<option value="${w.w}" ${w.w===selW?"selected":""}>${w.label} \u00b7 ${fmtD(w.start)} a ${fmtD(w.end)}</option>`).join("")}</select></div>`;
  }else if(state.rep==="mes"){
    const r=monthRange(state.repMonth);start=r.start;end=r.end;
    periodoLbl=`${MESES_FULL[Number(state.repMonth.split("-")[1])-1]} / ${state.repMonth.split("-")[0]}`;
    weekOptions=`<div class="fg"><label>M\u00eas</label><input type="month" id="rep_month" value="${state.repMonth}"></div>`;
  }else if(state.rep==="ano"){
    const r=yearRange(state.repYear);start=r.start;end=r.end;
    periodoLbl=`Ano ${state.repYear}`;
    weekOptions=`<div class="fg"><label>Ano</label><input type="number" id="rep_year" value="${state.repYear}" min="2020" max="2100" style="width:100px"></div>`;
  }else{
    start=state.repStart||today().slice(0,8)+"01";end=state.repEnd||today();
    periodoLbl="Per\u00edodo personalizado";
    weekOptions=`<div class="fg"><label>De</label><input type="date" id="rep_start" value="${start}"></div><div class="fg"><label>At\u00e9</label><input type="date" id="rep_end" value="${end}"></div>`;
  }
  _repRange={start,end};

  let {ent,sai,valEnt,qtdSai,qtdEnt}=aggregate(dom,start,end);
  // Filtro por unidade: em modo SMG6/XMG2 mostra apenas sa\u00eddas daquela unidade
  const repUnidade=dom==="safety"?(state.repUnidade||"geral"):"geral";
  if(repUnidade!=="geral"){
    sai=sai.filter(function(m){return colabUnidadeOf(m.parte||"")===repUnidade;});
    qtdSai=sai.reduce(function(s,m){return s+m.qtd;},0);
    // entradas n\u00e3o se aplicam ao relat\u00f3rio por unidade
    ent=[];valEnt=0;qtdEnt=0;
  }
  const porColab={};sai.forEach(s=>{if(s.parte&&!isExpurgo(s.parte))porColab[s.parte]=(porColab[s.parte]||0)+s.qtd;});
  // Painel: sa\u00eddas por EPI / Tipo
  var _porTipo={};
  sai.forEach(function(s){
    var _p2=PRODUTOS.find(function(x){return x.id===s.produtoId;});
    var _key=(_p2?_p2.descricao:"?")+(s.cor?" \u2014 "+s.cor:"");
    _porTipo[_key]=(_porTipo[_key]||0)+s.qtd;
  });
  var _tipoEntries=Object.entries(_porTipo).sort(function(a,b){return b[1]-a[1];});
  var tipoPanel=_tipoEntries.length?('<div class="panel" style="grid-column:1/-1">'
    +'<div class="panel-bar"><h3>&#128203; Sa\u00eddas por EPI / Tipo \u2014 '+periodoLbl+'</h3></div>'
    +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'
    +'<thead><tr>'
    +'<th style="text-align:left;font-size:10.5px;padding:6px 8px;border-bottom:2px solid var(--line);color:var(--txt-dim);text-transform:uppercase;letter-spacing:.05em">Item / Tipo</th>'
    +'<th style="text-align:right;font-size:10.5px;padding:6px 8px;border-bottom:2px solid var(--line);color:var(--txt-dim);text-transform:uppercase;letter-spacing:.05em">Qtd. sa\u00eddas</th>'
    +'</tr></thead><tbody>'
    +_tipoEntries.map(function(e){return '<tr><td style="font-size:12px;padding:5px 8px">'+esc(e[0])+'</td><td style="text-align:right;font-family:var(--mono);font-weight:700;font-size:13px;padding:5px 8px">'+e[1]+'</td></tr>';}).join("")
    +'</tbody></table></div></div>'):"";

  // ----- Linhas por item (com saldo inicial/entradas/sa\u00eddas/saldo final) -----
  const busca=(state.repBusca||"").trim().toLowerCase();
  let itens=prodOf(dom).map(p=>{
    if(repUnidade!=="geral"){
      // Apenas sa\u00eddas da unidade selecionada neste produto no per\u00edodo
      const unitSai=sai.filter(function(m){return m.produtoId===p.id;}).reduce(function(s,m){return s+m.qtd;},0);
      const ini=saldoAntes(p.id,start);
      return {id:p.id,nome:p.descricao,un:p.unidade||"UN",ca:dom==="safety"?caAtualProduto(p.id):"",ini:0,ent:0,sai:unitSai,fim:unitSai};
    }
    const ip=itemPeriodo(p.id,start,end);
    return {id:p.id,nome:p.descricao,un:p.unidade||"UN",ca:dom==="safety"?caAtualProduto(p.id):"",ini:ip.ini,ent:ip.ent,sai:ip.sai,fim:ip.fim};
  });
  // Filtro por item espec\u00edfico (dropdown) e busca textual
  if(state.repItem)itens=itens.filter(i=>i.id===state.repItem);
  if(busca)itens=itens.filter(i=>i.nome.toLowerCase().includes(busca));
  // S\u00f3 itens com movimenta\u00e7\u00e3o ou saldo, ordenados por sa\u00eddas desc
  const itensMov=itens.filter(i=>i.ent||i.sai||i.fim).sort((a,b)=>b.sai-a.sai||b.ent-a.ent||a.nome.localeCompare(b.nome,"pt-BR"));
  const maxBar=Math.max(1,...itensMov.map(i=>Math.max(i.ent,i.sai)));

  const barRows=itensMov.map(i=>{
    const eW=Math.round(i.ent/maxBar*100),sW=Math.round(i.sai/maxBar*100);
    const lowStock=i.fim<=0;
    return `<div class="itembar">
      <div class="top">
        <div class="nm">${esc(i.nome)}${i.ca?`<span class="ca">CA ${esc(i.ca)}</span>`:""}</div>
        <div class="sd" style="color:${lowStock?"var(--red)":"var(--blue)"}">${i.fim}<small> em estoque</small></div>
      </div>
      <div class="track" title="Entradas: ${i.ent} \u2022 Sa\u00eddas: ${i.sai}">
        ${i.ent?`<div class="bar ent" style="width:${Math.max(eW,8)}%">+${i.ent}</div>`:""}
        ${i.sai?`<div class="bar sai" style="width:${Math.max(sW,8)}%">\u2212${i.sai}</div>`:""}
        ${(!i.ent&&!i.sai)?`<div style="padding:0 10px;font-size:11px;color:var(--txt-faint);align-self:center">sem movimenta\u00e7\u00e3o no per\u00edodo</div>`:""}
      </div>
      <div class="meta">
        <span class="miniflow">
          <span class="pill ini">${i.ini}</span><span class="op">+</span>
          <span class="pill ent">${i.ent}</span><span class="op">\u2212</span>
          <span class="pill sai">${i.sai}</span><span class="op">=</span>
          <span class="pill fim">${i.fim}</span>
          <span style="color:var(--txt-faint);margin-left:4px">inicial \u00b7 entrou \u00b7 saiu \u00b7 final</span>
        </span>
      </div>
    </div>`;
  }).join("") || `<div class="empty">Nenhum item com movimenta\u00e7\u00e3o ou saldo neste per\u00edodo.${busca||state.repItem?" Ajuste o filtro.":""}</div>`;

  // Dropdown de itens
  const itemOpts=`<option value="">Todos os itens</option>`+prodOf(dom).slice().sort((a,b)=>a.descricao.localeCompare(b.descricao,"pt-BR")).map(p=>`<option value="${p.id}" ${state.repItem===p.id?"selected":""}>${esc(p.descricao)}</option>`).join("");

  // ----- Top colaboradores (Safety) -----
  let colabBlock="";
  if(dom==="safety"){
    const topColab=Object.entries(porColab).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const colabRows=topColab.map(([k,q],i)=>{
      const pct=Math.round(q/Math.max(1,topColab[0][1])*100);
      return `<div class="itembar">
        <div class="top"><div class="nm"><span style="font-size:11px;color:var(--txt-faint)">${i+1}\u00b0</span> ${esc(k)}</div><div class="sd">${q}<small> itens</small></div></div>
        <div class="track"><div class="bar sai" style="width:${Math.max(pct,8)}%">${q}</div></div>
      </div>`;
    }).join("") || `<div class="empty">Sem retiradas no per\u00edodo.</div>`;
    colabBlock=`<div class="panel"><div class="panel-bar"><h3>Quem mais retirou \u2014 ${periodoLbl}</h3></div>
      <div class="scroll-y" style="max-height:440px">${colabRows}</div></div>`;
  }

  // ----- Ajustes de estoque via EXPURGO (Safety) -----
  let expurgoBlock="";
  if(dom==="safety"){
    const expurgoMovs=sai.filter(function(m){return isExpurgo(m.parte);})
      .slice().sort(function(a,b){return a.data<b.data?1:(a.data>b.data?-1:0);});
    const expTotal=expurgoMovs.reduce(function(s,m){return s+m.qtd;},0);
    const expRows=expurgoMovs.map(function(m){
      var p=PRODUTOS.find(function(x){return x.id===m.produtoId;});
      var motivo=(m.obs||"").replace(/\[COD:.*?\]/g,"").trim();
      var tam=m.tamanho?('<span class="chip tam">'+esc(m.tamanho)+'</span>'):"";
      var cor=m.cor?('<span class="chip">'+esc(m.cor)+'</span>'):"";
      return '<tr>'
        +'<td style="white-space:nowrap">'+fmtD(m.data)+'</td>'
        +'<td><b>'+(p?esc(p.descricao):"?")+'</b></td>'
        +'<td>'+(tam||"&mdash;")+' '+cor+'</td>'
        +'<td style="text-align:center;color:#c0392b;font-weight:700">'+m.qtd+'</td>'
        +'<td>'+esc(m.liberadoPor||"&mdash;")+'</td>'
        +'<td style="font-size:11px;color:var(--txt-faint)">'+esc(motivo||"&mdash;")+'</td>'
        +'</tr>';
    }).join("");
    expurgoBlock=expurgoMovs.length
      ?'<div class="panel" style="grid-column:1/-1;border:1px solid #f0c36d;background:#fffdf5">'
        +'<div class="panel-bar" style="background:#fff8e6"><h3>&#9888; Ajustes de Estoque (Expurgo) \u2014 '+periodoLbl+'</h3>'
        +'<div class="right"><span style="font-size:12px;color:#946200;font-weight:700">'+expurgoMovs.length+' baixas \u00b7 '+expTotal+' itens</span></div></div>'
        +'<div style="padding:6px 16px 0;font-size:11.5px;color:var(--txt-dim)">Sa\u00eddas registradas no perfil <b>Expurgo</b> para acerto de saldo (itens entregues sem baixa no sistema). Confira antes de considerar diverg\u00eancia.</div>'
        +'<div class="scroll-y" style="max-height:380px;padding:8px 16px 16px"><table style="width:100%;border-collapse:collapse">'
        +'<thead><tr style="text-align:left;border-bottom:2px solid #f0c36d">'
        +'<th style="padding:6px 8px;font-size:11px">Data</th><th style="padding:6px 8px;font-size:11px">EPI</th>'
        +'<th style="padding:6px 8px;font-size:11px">Tam./Tipo</th><th style="padding:6px 8px;font-size:11px;text-align:center">Qtd</th>'
        +'<th style="padding:6px 8px;font-size:11px">Registrado por</th><th style="padding:6px 8px;font-size:11px">Motivo</th></tr></thead>'
        +'<tbody>'+expRows+'</tbody></table></div></div>'
      :"";
  }

  // ----- Resumo de totais para mini-gr\u00e1fico de colunas -----
  const totFim=itens.reduce((s,i)=>s+Math.max(0,i.fim),0);
  const maxCol=Math.max(qtdEnt,qtdSai,1);
  const colChart=`<div class="barcol">
    <div class="col"><div class="cap">${qtdEnt}</div><div class="stack" style="height:${Math.round(qtdEnt/maxCol*100)}%;background:linear-gradient(180deg,#27b863,#1f9d55)"></div><div class="xl">Entradas</div></div>
    <div class="col"><div class="cap">${qtdSai}</div><div class="stack" style="height:${Math.round(qtdSai/maxCol*100)}%;background:linear-gradient(180deg,#e8554a,#d23b30)"></div><div class="xl">Sa\u00eddas</div></div>
    <div class="col"><div class="cap">${totFim}</div><div class="stack" style="height:${Math.round(Math.min(totFim,maxCol)/maxCol*100)}%;background:linear-gradient(180deg,#3a40a0,#2D3277)"></div><div class="xl">Saldo<br>atual</div></div>
  </div>`;

  // ----- Gr\u00e1fico de EVOLU\u00c7\u00c3O DO SALDO ao longo do per\u00edodo -----
  // Pontos: se item espec\u00edfico \u2192 saldo daquele item; sen\u00e3o \u2192 saldo total do dom\u00ednio (todos os itens).
  const evoPts=buildEvolucao(dom,start,end,state.repItem);
  const selectedProd=state.repItem?PRODUTOS.find(x=>x.id===state.repItem):null;
  const evoSVG=lineChartSVG(evoPts,selectedProd?("Saldo de "+selectedProd.descricao):"Saldo total em estoque");
  let evoBlock;
  if(state.repItem&&selectedProd){
    const entSaiPts=buildEntSaiEvolucao(dom,state.repItem,start,end);
    const dualSVG=dualLineChartSVG(entSaiPts);
    const hasTams=selectedProd.tamanhos&&selectedProd.tamanhos.length>0;
    const tamChart=hasTams?buildTamBarChart(state.repItem,selectedProd.tamanhos,start,end):"";
    evoBlock=`<div class="panel" style="grid-column:1 / -1">
      <div class="panel-bar"><h3>Evolu\u00e7\u00e3o \u2014 ${esc(selectedProd.descricao)} \u00b7 ${periodoLbl}</h3>
        <div class="legend">
          <span><span class="dot" style="background:#27b863"></span>Entradas acum.</span>
          <span><span class="dot" style="background:#e8554a"></span>Sa\u00eddas acum.</span>
          <span><span class="dot" style="background:#2D3277"></span>Saldo</span>
        </div>
      </div>
      <div style="padding:14px 8px 2px"><div style="font-size:11px;font-weight:700;color:var(--txt-dim);margin-bottom:4px;padding-left:8px">Entradas \u00d7 Sa\u00eddas (acumulado no per\u00edodo)</div>${dualSVG}</div>
      <div style="padding:4px 8px 6px"><div style="font-size:11px;font-weight:700;color:var(--txt-dim);margin-bottom:4px;padding-left:8px">Evolu\u00e7\u00e3o do Saldo</div>${evoSVG}</div>
      ${hasTams?`<div style="padding:8px 14px 14px"><div style="font-size:11px;font-weight:700;color:var(--txt-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Por Tamanho \u2014 ${periodoLbl}</div>${tamChart}</div>`:""}
    </div>`;
  }else{
    // Consumo por EPI \u00d7 Tamanho no per\u00edodo (substitui gr\u00e1fico de saldo total)
    var _cpMap={};
    sai.forEach(function(m){
      var _p=PRODUTOS.find(function(x){return x.id===m.produtoId;});
      if(!_p)return;
      var k=m.produtoId;
      if(!_cpMap[k])_cpMap[k]={nome:_p.descricao,qtd:0,tams:{}};
      _cpMap[k].qtd+=m.qtd;
      if(m.tamanho){_cpMap[k].tams[m.tamanho]=(_cpMap[k].tams[m.tamanho]||0)+m.qtd;}
      if(m.cor&&!m.tamanho){var ck="("+m.cor+")";_cpMap[k].tams[ck]=(_cpMap[k].tams[ck]||0)+m.qtd;}
    });
    var _cpList=Object.values(_cpMap).sort(function(a,b){return b.qtd-a.qtd;}).slice(0,12);
    var _cpMax=_cpList.length?_cpList[0].qtd:1;
    var HEATCOLS=["#fff0f0","#ffcccc","#ff9999","#ff6666","#e84040","#c0392b"];
    var _cpRows=_cpList.map(function(item){
      var tamEntries=Object.entries(item.tams).sort(function(a,b){return b[1]-a[1];});
      var tamMax=tamEntries.length?tamEntries[0][1]:1;
      var tamCells=tamEntries.map(function(e){
        var t=e[0],q=e[1];
        var ci=Math.min(5,Math.floor(q/tamMax*5));
        var bg=HEATCOLS[ci];
        var txtc=ci>=3?"#fff":"#2c2c2c";
        return "<div style='display:inline-flex;flex-direction:column;align-items:center;padding:5px 10px;border-radius:8px;min-width:48px;background:"+bg+";margin:3px'>"
          +"<span style='font-family:var(--mono);font-weight:800;font-size:15px;color:"+txtc+"'>"+q+"</span>"
          +"<span style='font-size:10px;font-weight:600;color:"+txtc+";margin-top:2px;letter-spacing:.03em'>"+esc(t)+"</span>"
          +"</div>";
      }).join("");
      var pct=Math.round(item.qtd/_cpMax*100);
      return "<div style='padding:10px 16px;border-bottom:1px solid var(--line-soft)'>"
        +"<div style='display:flex;align-items:center;gap:10px;margin-bottom:5px'>"
        +"<span style='flex:1;font-size:13px;font-weight:700;color:var(--txt)'>"+esc(item.nome)+"</span>"
        +"<span style='font-family:var(--mono);font-weight:800;font-size:15px;color:var(--red)'>"+item.qtd+"</span>"
        +"<span style='font-size:11px;color:var(--txt-faint)'>unid.</span>"
        +"</div>"
        +"<div style='height:6px;background:#f0f2f5;border-radius:4px;overflow:hidden;margin-bottom:8px'>"
        +"<div style='height:100%;width:"+pct+"%;background:linear-gradient(90deg,#e84040,#ff6b6b);border-radius:4px'></div>"
        +"</div>"
        +(tamCells?"<div style='display:flex;flex-wrap:wrap;gap:2px'>"+tamCells+"</div>":"")
        +"</div>";
    }).join("");
    evoBlock=`<div class="panel" style="grid-column:1 / -1">
      <div class="panel-bar"><h3>\ud83d\udd25 Consumo por EPI / Tamanho \u2014 ${periodoLbl}</h3>
        <div class="legend"><span><span class="dot" style="background:var(--red)"></span>Sa\u00eddas no per\u00edodo</span></div>
      </div>
      <div class="scroll-y" style="max-height:440px">${_cpRows||'<div class="empty">Nenhuma sa\u00edda registrada no per\u00edodo.</div>'}</div>
    </div>`;
  }

  // ----- ALERTA DE ESTOQUE M\u00cdNIMO -----
  const alertas=itensAbaixoMin(dom);
  const alertRows=alertas.map(a=>{
    const crit=a.saldo<=0;
    return `<div class="itembar" style="background:${crit?"var(--red-bg)":"#fff8ee"}">
      <div class="top">
        <div class="nm">${crit?"&#9888;&#65039; ":"&#128276; "}${esc(a.p.descricao)}</div>
        <div class="sd" style="color:${crit?"var(--red)":"var(--amber)"}">${a.saldo}<small> / m\u00edn ${a.min}</small></div>
      </div>
      <div class="meta"><span style="color:${crit?"var(--red)":"var(--amber)"};font-weight:600">${crit?"Sem estoque \u2014 repor com urg\u00eancia":"Abaixo do m\u00ednimo \u2014 programar reposi\u00e7\u00e3o ("+(a.min-a.saldo>0?("faltam "+(a.min-a.saldo)):"no limite")+")"}</span></div>
    </div>`;
  }).join("");
  const totalProdsDom=prodOf(dom).length;
  const semMin=Object.keys(ESTOQUE_MIN).filter(id=>{const p=PRODUTOS.find(x=>x.id===id);return p&&p.dom===dom;}).length;

/* ===== Construir s\u00e9rie de evolu\u00e7\u00e3o do saldo ===== */
function buildEvolucao(dom,start,end,pid){
  const sd=new Date(start),ed=new Date(end);
  const totalDays=Math.round((ed-sd)/86400000)+1;
  // Define o passo: di\u00e1rio se <=31 dias, semanal se mais
  const pts=[];
  const ids=pid?[pid]:prodOf(dom).map(p=>p.id);
  function saldoConjuntoAte(date){return ids.reduce((s,id)=>s+saldoAteData(id,date),0);}
  if(totalDays<=31){
    for(let i=0;i<totalDays;i++){
      const d=new Date(sd);d.setDate(d.getDate()+i);const ds=d.toISOString().slice(0,10);
      pts.push({x:ds,label:String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"),y:saldoConjuntoAte(ds)});
    }
  }else{
    // amostragem semanal
    let d=new Date(sd);
    while(d<=ed){
      const ds=d.toISOString().slice(0,10);
      pts.push({x:ds,label:String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"),y:saldoConjuntoAte(ds)});
      d.setDate(d.getDate()+7);
    }
    const dsEnd=ed.toISOString().slice(0,10);
    if(!pts.length||pts[pts.length-1].x!==dsEnd)pts.push({x:dsEnd,label:String(ed.getDate()).padStart(2,"0")+"/"+String(ed.getMonth()+1).padStart(2,"0"),y:saldoConjuntoAte(dsEnd)});
  }
  return pts;
}

/* ===== S\u00e9rie dupla entradas/sa\u00eddas acumuladas no per\u00edodo ===== */
function buildEntSaiEvolucao(dom,prodId,start,end){
  const sd=new Date(start),ed=new Date(end);
  const totalDays=Math.round((ed-sd)/86400000)+1;
  const step=totalDays<=31?1:7;
  const pts=[];
  for(let i=0;i<totalDays;i+=step){
    const d=new Date(sd);d.setDate(d.getDate()+i);const ds=d.toISOString().slice(0,10);
    const label=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    const entAte=MOVS.filter(m=>m.produtoId===prodId&&m.tipo==="entrada"&&m.data>=start&&m.data<=ds).reduce((s,m)=>s+(m.qtd||0),0);
    const saiAte=MOVS.filter(m=>m.produtoId===prodId&&m.tipo==="saida"&&m.data>=start&&m.data<=ds).reduce((s,m)=>s+(m.qtd||0),0);
    pts.push({x:ds,label,ent:entAte,sai:saiAte});
  }
  const dsEnd=ed.toISOString().slice(0,10);
  if(!pts.length||pts[pts.length-1].x!==dsEnd){
    const entF=MOVS.filter(m=>m.produtoId===prodId&&m.tipo==="entrada"&&m.data>=start&&m.data<=dsEnd).reduce((s,m)=>s+(m.qtd||0),0);
    const saiF=MOVS.filter(m=>m.produtoId===prodId&&m.tipo==="saida"&&m.data>=start&&m.data<=dsEnd).reduce((s,m)=>s+(m.qtd||0),0);
    const lbl=String(ed.getDate()).padStart(2,"0")+"/"+String(ed.getMonth()+1).padStart(2,"0");
    pts.push({x:dsEnd,label:lbl,ent:entF,sai:saiF});
  }
  return pts;
}

/* ===== SVG: duas linhas (entradas verde, sa\u00eddas vermelho) ===== */
function dualLineChartSVG(pts){
  if(!pts||pts.length<2)return `<div class="empty">Dados insuficientes para o gr\u00e1fico.</div>`;
  const W=900,H=220,pl=48,pr=18,pt=18,pb=42;
  const iw=W-pl-pr,ih=H-pt-pb;
  const ents=pts.map(p=>p.ent),sais=pts.map(p=>p.sai);
  let ymax=Math.max(...ents,...sais,1);
  const range=ymax||1;
  const X=i=>pl+(i/(pts.length-1))*iw;
  const Y=v=>pt+ih-(v/range)*ih;
  let grid="",ylab="";
  for(let g=0;g<=4;g++){const val=range*g/4;const yy=Y(val);
    grid+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#e6ebf1" stroke-width="1"/>`;
    ylab+=`<text x="${pl-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8b94a3" font-family="monospace">${Math.round(val)}</text>`;
  }
  const pathEnt=pts.map((p,i)=>(i===0?"M":"L")+X(i).toFixed(1)+","+Y(p.ent).toFixed(1)).join(" ");
  const pathSai=pts.map((p,i)=>(i===0?"M":"L")+X(i).toFixed(1)+","+Y(p.sai).toFixed(1)).join(" ");
  const stepX=Math.ceil(pts.length/8);
  let xlab="";
  for(let i=0;i<pts.length;i+=stepX)xlab+=`<text x="${X(i).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-size="10" fill="#8b94a3">${pts[i].label}</text>`;
  if(pts.length>1&&(pts.length-1)%stepX!==0)xlab+=`<text x="${X(pts.length-1).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-size="10" fill="#8b94a3">${pts[pts.length-1].label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:220px;display:block">
    ${grid}${ylab}${xlab}
    <path d="${pathEnt}" fill="none" stroke="#27b863" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${pathSai}" fill="none" stroke="#e8554a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ===== Gr\u00e1fico de linha SVG (responsivo) ===== */
function lineChartSVG(pts,titulo){
  if(!pts||pts.length<2)return `<div class="empty">Dados insuficientes para o gr\u00e1fico (apenas ${pts?pts.length:0} ponto).</div>`;
  const W=900,H=240,pl=48,pr=18,pt=18,pb=42;
  const iw=W-pl-pr,ih=H-pt-pb;
  const ys=pts.map(p=>p.y);
  let ymax=Math.max(...ys,1),ymin=Math.min(...ys,0);
  if(ymin>0)ymin=0;
  const range=(ymax-ymin)||1;
  const X=i=>pl+(i/(pts.length-1))*iw;
  const Y=v=>pt+ih-((v-ymin)/range)*ih;
  // grid + labels Y (4 linhas)
  let grid="",ylab="";
  for(let g=0;g<=4;g++){
    const val=ymin+range*g/4;const yy=Y(val);
    grid+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#e6ebf1" stroke-width="1"/>`;
    ylab+=`<text x="${pl-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8b94a3" font-family="monospace">${Math.round(val)}</text>`;
  }
  // X labels (no m\u00e1ximo ~8)
  const step=Math.ceil(pts.length/8);
  let xlab="";
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)xlab+=`<text x="${X(i).toFixed(1)}" y="${H-pb+20}" text-anchor="middle" font-size="10.5" fill="#8b94a3">${p.label}</text>`;});
  // area + line
  const linePts=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const areaPts=`${pl},${Y(ymin).toFixed(1)} ${linePts} ${(W-pr)},${Y(ymin).toFixed(1)}`;
  let dots="";
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="#2D3277"/><title>${p.label}: ${p.y}</title>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <defs><linearGradient id="evoFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2D3277" stop-opacity="0.18"/><stop offset="100%" stop-color="#2D3277" stop-opacity="0.01"/></linearGradient></defs>
    ${grid}${ylab}
    <polygon points="${areaPts}" fill="url(#evoFill)"/>
    <polyline points="${linePts}" fill="none" stroke="#2D3277" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
  </svg>`;
}

/* ===== AN\u00c1LISES: motivos, top itens, previs\u00e3o de demanda ===== */
const MOTIVO_CORES={"Primeiro Item":"#2D3277","Dano":"#d23b30","Perda":"#b8860b","Desgaste":"#1f9d55","Outro":"#7a7f8c"};
/* Extrai o motivo de uma movimenta\u00e7\u00e3o (campo direto ou parse de obs) */
function motivoDe(m){
  if(m.motivo)return m.motivo;
  if(m.obs){var x=/Motivo:\s*([^\u2014\[\n]+)/i.exec(m.obs);if(x)return x[1].trim();}
  return "";
}
/* Agrega motivos das sa\u00eddas no per\u00edodo */
function agregarMotivos(dom,start,end){
  const cont={};let total=0;
  MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom&&m.data>=start&&m.data<=end).forEach(m=>{
    let mo=motivoDe(m)||"N\u00e3o informado";
    cont[mo]=(cont[mo]||0)+m.qtd;total+=m.qtd;
  });
  return {cont:cont,total:total};
}
/* Gr\u00e1fico DONUT (pizza com furo) em SVG */
function donutSVG(dados,total){
  const entries=Object.entries(dados).sort((a,b)=>b[1]-a[1]);
  if(!entries.length||total===0)return `<div class="empty">Sem retiradas com motivo no per\u00edodo.</div>`;
  const cx=110,cy=110,r=88,rin=52;let ang=-Math.PI/2;
  let paths="";
  entries.forEach(([k,v])=>{
    const frac=v/total,a2=ang+frac*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi1=cx+rin*Math.cos(a2),yi1=cy+rin*Math.sin(a2),xi2=cx+rin*Math.cos(ang),yi2=cy+rin*Math.sin(ang);
    const large=frac>0.5?1:0;
    const col=MOTIVO_CORES[k]||"#7a7f8c";
    paths+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi1.toFixed(1)} ${yi1.toFixed(1)} A${rin} ${rin} 0 ${large} 0 ${xi2.toFixed(1)} ${yi2.toFixed(1)} Z" fill="${col}"><title>${esc(k)}: ${v} (${Math.round(frac*100)}%)</title></path>`;
    ang=a2;
  });
  const legend=entries.map(([k,v])=>`<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0">
    <span style="width:11px;height:11px;border-radius:3px;background:${MOTIVO_CORES[k]||"#7a7f8c"};flex:0 0 auto"></span>
    <span style="flex:1">${esc(k)}</span><b>${v}</b><span style="color:var(--txt-faint)">${Math.round(v/total*100)}%</span></div>`).join("");
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px">
    <svg viewBox="0 0 220 220" width="200" height="200" style="flex:0 0 auto">
      ${paths}
      <text x="110" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#2D3277" font-family="Archivo,sans-serif">${total}</text>
      <text x="110" y="126" text-anchor="middle" font-size="12" fill="#8b94a3">retiradas</text>
    </svg>
    <div style="flex:1;min-width:180px;max-width:280px">${legend}</div>
  </div>`;
}
/* Consumo m\u00e9dio di\u00e1rio de um item, com base em N dias de hist\u00f3rico de sa\u00eddas */
function consumoMedioDiario(pid,dias){
  dias=dias||90;
  const hoje=today();const ini=addDays(hoje,-dias);
  const saidas=movOf(pid).filter(m=>m.tipo==="saida"&&m.data>=ini&&m.data<=hoje);
  const totalSai=saidas.reduce((s,m)=>s+m.qtd,0);
  return totalSai/dias;
}
/* Previs\u00e3o de necessidade de compra por item */
function previsaoCompra(dom,horizonteDias){
  horizonteDias=horizonteDias||30;
  return prodOf(dom).map(p=>{
    const saldo=atual(p.id);
    const cmd=consumoMedioDiario(p.id,90);
    const previsto=cmd*horizonteDias; // consumo estimado no horizonte
    const min=getMin(p.id);
    // Necessidade: cobrir consumo do horizonte + manter o m\u00ednimo, descontando saldo
    const necessidade=Math.max(0,Math.ceil(previsto+min-saldo));
    const diasRestantes=cmd>0?Math.floor(saldo/cmd):Infinity;
    const custo=custoUnit(p.id);
    return {p:p,saldo:saldo,cmd:cmd,previsto:Math.round(previsto),min:min,necessidade:necessidade,diasRestantes:diasRestantes,custo:custo,ca:caAtualProduto(p.id)};
  }).filter(x=>x.cmd>0||x.saldo>0);
}
function addDays(d,n){const dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}

/* Mini gr\u00e1fico de barras horizontais (top itens) */
function topItensSaida(dom,start,end,limite){
  limite=limite||5;
  const cont={};
  MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom&&m.data>=start&&m.data<=end).forEach(m=>{
    cont[m.produtoId]=(cont[m.produtoId]||0)+m.qtd;
  });
  return Object.entries(cont).map(([pid,q])=>{
    const p=PRODUTOS.find(x=>x.id===pid);return {nome:p?p.descricao:pid,qtd:q};
  }).sort((a,b)=>b.qtd-a.qtd).slice(0,limite);
}
/* Barras verticais estilo dashboard (top 5 EPIs) */
function colBarsSVG(itens){
  if(!itens.length)return `<div class="empty">Sem entregas no per\u00edodo.</div>`;
  const max=Math.max(...itens.map(i=>i.qtd),1);
  const W=Math.max(itens.length*120,360),H=230,pb=54,pt=30;
  const bw=58,gap=(W-itens.length*bw)/(itens.length+1);
  let bars="";
  itens.forEach((it,i)=>{
    const x=gap+i*(bw+gap),h=(it.qtd/max)*(H-pb-pt),y=H-pb-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" fill="#2D3277"><title>${esc(it.nome)}: ${it.qtd}</title></rect>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800" fill="#2D3277" font-family="Archivo,sans-serif">${it.qtd}</text>`;
    const nome=it.nome.length>16?it.nome.slice(0,15)+"\u2026":it.nome;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-pb+18}" text-anchor="middle" font-size="11" fill="#5b6675">${esc(nome)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${bars}</svg>`;
}
/* Entregas por m\u00eas (linha) no ano corrente do relat\u00f3rio */
function entregasPorMes(dom,ano){
  const arr=new Array(12).fill(0);
  MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom&&m.data.slice(0,4)===String(ano)).forEach(m=>{
    const mes=Number(m.data.slice(5,7))-1;if(mes>=0&&mes<12)arr[mes]+=m.qtd;
  });
  return arr;
}
function monthLineSVG(valores){
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const W=900,H=220,pl=36,pr=18,pt=24,pb=36,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...valores,1);
  const X=i=>pl+(i/11)*iw, Y=v=>pt+ih-(v/max)*ih;
  const pts=valores.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${pl},${(pt+ih).toFixed(1)} ${pts} ${(W-pr)},${(pt+ih).toFixed(1)}`;
  let dots="",labs="";
  valores.forEach((v,i)=>{
    dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="#2D3277"/>`;
    if(v>0)dots+=`<text x="${X(i).toFixed(1)}" y="${(Y(v)-8).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#2D3277">${v}</text>`;
    labs+=`<text x="${X(i).toFixed(1)}" y="${H-pb+18}" text-anchor="middle" font-size="10.5" fill="#8b94a3">${meses[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <defs><linearGradient id="mlFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2D3277" stop-opacity="0.16"/><stop offset="100%" stop-color="#2D3277" stop-opacity="0.01"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#mlFill)"/>
    <polyline points="${pts}" fill="none" stroke="#2D3277" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labs}
  </svg>`;
}
/* Status de C.A. (v\u00e1lido/sem informa\u00e7\u00e3o) \u2014 heur\u00edstica simples */
function statusCA(dom){
  let comCA=0,semCA=0;
  prodOf(dom).forEach(p=>{const ca=caAtualProduto(p.id);if(ca)comCA++;else semCA++;});
  return {comCA:comCA,semCA:semCA};
}

  let gTotalEnt=0,gTotalSai=0,gTotalAtual=0;

  prods.forEach(function(p){
    const ca=dom==="safety"?caAtualProduto(p.id):"";
    const caTag=ca?`<span class="ca-badge">CA ${esc(ca)}</span>`:"";
    const hasTams=p.tamanhos&&p.tamanhos.length>0;

    if(hasTams){
      let pEnt=0,pSai=0,pIni=0;
      // estoque sem tamanho (lan\u00e7ado antes de tamanhos serem configurados)
      const semTamSaldo=saldoVar(p.id,"","");
      const semTamEnt=MOVS.filter(m=>m.produtoId===p.id&&m.tipo==="entrada"&&(m.tamanho||"")===""&&m.data>=start&&m.data<=end).reduce((s,m)=>s+(m.qtd||0),0);
      const semTamSai=MOVS.filter(m=>m.produtoId===p.id&&m.tipo==="saida"&&(m.tamanho||"")===""&&m.data>=start&&m.data<=end).reduce((s,m)=>s+(m.qtd||0),0);
      const hasSemTam=semTamSaldo>0||semTamEnt>0||semTamSai>0;
      const rowspan=p.tamanhos.length+(hasSemTam?1:0)+1; // +sem-tam row +total row
      const tamRows=p.tamanhos.map(function(tam,ti){
        const entT=MOVS.filter(m=>m.produtoId===p.id&&m.tipo==="entrada"&&String(m.tamanho||"").trim()===String(tam||"").trim()&&m.data>=start&&m.data<=end).reduce((s,m)=>s+(m.qtd||0),0);
        const saiT=MOVS.filter(m=>m.produtoId===p.id&&m.tipo==="saida"&&String(m.tamanho||"").trim()===String(tam||"").trim()&&m.data>=start&&m.data<=end).reduce((s,m)=>s+(m.qtd||0),0);
        const salT=saldoVar(p.id,tam,"");
        const iniT=salT-entT+saiT;
        pEnt+=entT;pSai+=saiT;pIni+=iniT;
        const isFirst=ti===0;
        return `<tr class="${salT<=0?"row-zero":""}">`
          +(isFirst?`<td rowspan="${rowspan}" class="nm-cell">${esc(p.descricao)}<br>${caTag}</td>`:"")
          +`<td class="tam-cell">${esc(tam)}</td>`
          +`<td class="n ini">${iniT}</td>`
          +`<td class="n ent">${entT>0?"+"+entT:"\u2014"}</td>`
          +`<td class="n sai">${saiT>0?"\u2212"+saiT:"\u2014"}</td>`
          +`<td class="n fim${salT<=0?" zero":""}">${salT}</td>`
          +`</tr>`;
      }).join("");
      const semTamRow=hasSemTam
        ?`<tr style="background:#fff8e1">`
          +`<td class="tam-cell" style="color:#856404;font-size:10px">\u26a0 Sem tam.</td>`
          +`<td class="n ini" style="color:#856404">${semTamSaldo-semTamEnt+semTamSai}</td>`
          +`<td class="n ent" style="color:#856404">${semTamEnt>0?"+"+semTamEnt:"\u2014"}</td>`
          +`<td class="n sai" style="color:#856404">${semTamSai>0?"\u2212"+semTamSai:"\u2014"}</td>`
          +`<td class="n fim" style="color:#856404;font-weight:800">${semTamSaldo}</td>`
          +`</tr>`
        :"";
      if(hasSemTam){pEnt+=semTamEnt;pSai+=semTamSai;}
      const totAtual=atual(p.id);
      gTotalEnt+=pEnt;gTotalSai+=pSai;gTotalAtual+=totAtual;
      tableRows+=tamRows+semTamRow
        +`<tr class="tot-row">`
        +`<td class="tam-tot">Total</td>`
        +`<td class="n ini-t">${pIni+(hasSemTam?semTamSaldo-semTamEnt+semTamSai:0)}</td>`
        +`<td class="n ent-t">${pEnt>0?"+"+pEnt:"\u2014"}</td>`
        +`<td class="n sai-t">${pSai>0?"\u2212"+pSai:"\u2014"}</td>`
        +`<td class="n fim-t${totAtual<=0?" zero":""}">${totAtual}</td>`
        +`</tr>`;
    }else{
      const ip=itemPeriodo(p.id,start,end);
      const salAtual=atual(p.id);
      gTotalEnt+=ip.ent;gTotalSai+=ip.sai;gTotalAtual+=salAtual;
      tableRows+=`<tr class="${salAtual<=0?"row-zero":""}">`
        +`<td class="nm-cell">${esc(p.descricao)}<br>${caTag}</td>`
        +`<td class="tam-cell" style="color:#b0b8c8">\u2014</td>`
        +`<td class="n ini">${ip.ini}</td>`
        +`<td class="n ent">${ip.ent>0?"+"+ip.ent:"\u2014"}</td>`
        +`<td class="n sai">${ip.sai>0?"\u2212"+ip.sai:"\u2014"}</td>`
        +`<td class="n fim${salAtual<=0?" zero":""}">${salAtual}</td>`
        +`</tr>`;
    }
  });

  if(!tableRows)tableRows=`<tr><td colspan="6" style="text-align:center;padding:28px;color:#888">Nenhum item encontrado para o per\u00edodo.</td></tr>`;

  // Alertas de estoque m\u00ednimo
  const alertasPDF=itensAbaixoMin(dom);
  const alertRowsPDF=alertasPDF.map(a=>`<tr style="background:${a.saldo<=0?"#fbe5e3":"#fff8ee"}">`
    +`<td class="nm-cell">${a.saldo<=0?"\u26a0 ":""}${esc(a.p.descricao)}</td>`
    +`<td class="n">${a.min}</td>`
    +`<td class="n" style="color:${a.saldo<=0?"#d23b30":"#b8860b"};font-weight:800">${a.saldo}</td>`
    +`<td style="color:${a.saldo<=0?"#d23b30":"#b8860b"};font-size:11px">${a.saldo<=0?"Repor com urg\u00eancia":"Programar reposi\u00e7\u00e3o"}</td>`
    +`</tr>`).join("");
  const alertSectionPDF=alertasPDF.length
    ?`<h2>\u26a0 Alertas de Estoque M\u00ednimo (${alertasPDF.length})</h2>
      <table><thead><tr><th>Produto / EPI</th><th class="n">M\u00ednimo</th><th class="n">Saldo atual</th><th>Status</th></tr></thead>
      <tbody>${alertRowsPDF}</tbody></table>`:"";

  var _mk=document.querySelector(".logo .mark");
  const logoTag=(_mk&&_mk.src)?`<img src="${_mk.src}" style="height:44px">`:`<div style="font-family:Arial;font-weight:800;font-size:18px;color:#2D3277">SMG6 \u00b7 Estoque</div>`;

  const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
  <title>Relat\u00f3rio de Estoque \u2014 ${esc(periodoLbl)}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Segoe UI",Arial,sans-serif;color:#1d2733;padding:28px 36px;background:#fff;font-size:12.5px}
    .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #FFE600;padding-bottom:13px;margin-bottom:14px}
    .head .meta{text-align:right;font-size:10.5px;color:#5b6675;line-height:1.7}
    h1{font-size:18px;color:#2D3277;margin:0 0 2px;font-weight:800}
    .sub{font-size:11.5px;color:#5b6675;margin-bottom:14px}
    .kpis{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
    .kpi{flex:1;min-width:120px;border:1px solid #d3dae4;border-radius:8px;padding:10px 13px;border-left:4px solid #2D3277}
    .kpi.g{border-left-color:#1f9d55}.kpi.r{border-left-color:#d23b30}.kpi.a{border-left-color:#b8860b}.kpi.b{border-left-color:#2D3277}
    .kpi .l{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#8b94a3;font-weight:700}
    .kpi .v{font-size:22px;font-weight:800;margin-top:2px;color:#1d2733}
    .kpi .m{font-size:10px;color:#5b6675;margin-top:1px}
    h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5b6675;margin:18px 0 7px;padding-bottom:5px;border-bottom:2px solid #e6ebf1;font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:11.5px}
    th{text-align:left;background:#2D3277;color:#fff;padding:7px 10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
    th.n{text-align:right}
    td{padding:5px 10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
    td.n{text-align:right;font-variant-numeric:tabular-nums}
    td.nm-cell{font-weight:600;min-width:160px}
    .ca-badge{display:inline-block;font-size:9px;font-weight:700;color:#2D3277;background:#e8e9f5;padding:1px 5px;border-radius:5px;margin-top:2px}
    td.tam-cell{text-align:center;font-size:11px;color:#5b6675;font-weight:600}
    td.ini{color:#8b94a3}
    td.ent{color:#1f9d55;font-weight:700}
    td.sai{color:#d23b30;font-weight:700}
    td.fim{color:#2D3277;font-weight:800;font-size:13px}
    td.fim.zero,td.fim-t.zero{color:#d23b30!important}
    tr.row-zero td{background:#fef9f9}
    tr:nth-child(even):not(.tot-row):not(.grand-tot){background:#fafbfd}
    tr.tot-row td{background:#eef1fa;font-weight:700;border-top:1.5px solid #b8bedd;border-bottom:2px solid #b8bedd}

    tr.grand-tot td.n{text-align:right}
    .foot{margin-top:22px;padding-top:10px;border-top:1px solid #e6ebf1;font-size:10px;color:#8b94a3;display:flex;justify-content:space-between}
    .noprint{margin:18px 0;text-align:center}
    .btn{background:#2D3277;color:#fff;border:none;padding:10px 20px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;margin:0 5px}
    .btn.sec{background:#fff;color:#2D3277;border:1.5px solid #2D3277}
    @media print{
      .noprint{display:none}
      body{padding:0}
      h2{page-break-after:avoid}
      tr{page-break-inside:avoid}
      thead{display:table-header-group}
    }
  </style></head><body>
    <div class="head">
      ${logoTag}
      <div class="meta">
        <b>Relat\u00f3rio de Estoque \u2014 ${dom==="safety"?"EPI / Safety":"Insumos"}</b><br>
        Per\u00edodo: <b>${fmtD(start)}</b> a <b>${fmtD(end)}</b><br>
        Gerado em ${now}
      </div>
    </div>
    <h1>Controle de Estoque \u2014 ${dom==="safety"?"Equipamentos de Prote\u00e7\u00e3o Individual":"Insumos"}</h1>
    <div class="sub">${esc(periodoLbl)}</div>
    <div class="kpis">
      <div class="kpi g"><div class="l">Entradas no per\u00edodo</div><div class="v">${qtdEnt}</div><div class="m">${ent.length} lan\u00e7amento(s) \u00b7 ${brl(valEnt)}</div></div>
      <div class="kpi r"><div class="l">Sa\u00eddas no per\u00edodo</div><div class="v">${qtdSai}</div><div class="m">${sai.length} registro(s)</div></div>
      <div class="kpi b"><div class="l">Saldo atual total</div><div class="v">${gTotalAtual}</div><div class="m">todos os itens</div></div>
      <div class="kpi a"><div class="l">Colaboradores atendidos</div><div class="v">${Object.keys(porColab).length}</div><div class="m">no per\u00edodo</div></div>
    </div>
    ${alertSectionPDF}
    <h2>Estoque por Item e Tamanho \u2014 ${esc(periodoLbl)}</h2>
    <table>
      <thead>
        <tr>
          <th style="min-width:160px">Produto / EPI</th>
          <th style="text-align:center;width:64px">Tamanho</th>
          <th class="n" style="width:72px">Est. Inicial</th>
          <th class="n" style="width:72px">Entradas</th>
          <th class="n" style="width:72px">Sa\u00eddas</th>
          <th class="n" style="width:84px">Saldo Atual</th>
        </tr>
      </thead>
      <tbody>
        ${tableRows}
        <tr class="grand-tot">
          <td colspan="2">TOTAL GERAL</td>
          <td class="n">\u2014</td>
          <td class="n">+${gTotalEnt}</td>
          <td class="n">\u2212${gTotalSai}</td>
          <td class="n">${gTotalAtual}</td>
        </tr>
      </tbody>
    </table>
    <div class="noprint">
      <button class="btn" onclick="window.print()">\ud83d\udda8 Imprimir / Salvar PDF</button>
      <button class="btn sec" onclick="window.close()">Fechar</button>
    </div>
    <div class="foot">
      <span>Controle de Estoque SMG6 \u2014 Mercado Livre</span>
      <span>Documento gerado automaticamente pelo sistema</span>
    </div>
  </body></html>`;

  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,"_blank");
  if(!win)toast("Permita pop-ups para abrir o relat\u00f3rio visual.","warn");
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function abrirRelatorioFormal(){
  var dom=state.dom;
  var r=(_repRange&&_repRange.start&&_repRange.end)?_repRange:repRange();
  var start=r.start,end=r.end;
  var periodoLbl=document.querySelector(".stat .l")?document.querySelector(".stat .l").textContent:"Per\u00edodo";
  var now=new Date().toLocaleString("pt-BR");
  var repUnidade=(dom==="safety")?(state.repUnidade||"geral"):"geral";

  var agg=aggregate(dom,start,end);
  var entAll=agg.ent,saiAll=agg.sai;

  // Apply unit filter to sa\u00eddas
  var sai=repUnidade==="geral"?saiAll:saiAll.filter(function(m){return colabUnidadeOf(m.parte||"")===repUnidade;});
  var ent=entAll;

  var qtdEnt=ent.reduce(function(s,m){return s+(m.qtd||0);},0);
  var qtdSai=sai.reduce(function(s,m){return s+(m.qtd||0);},0);
  var valEnt=ent.reduce(function(s,m){return s+((m.custoUnit||0)*(m.qtd||0));},0);

  var prods=prodOf(dom).slice().sort(function(a,b){return a.descricao.localeCompare(b.descricao,"pt-BR");});

  // ---- Pre-compute balance for KPI low-stock count ----
  var itemsData=[];
  prods.forEach(function(p){
    var ip=itemPeriodo(p.id,start,end);
    var minimo=getMin(p.id);
    var sitClass="ok";
    if(ip.fim<=0){sitClass="danger";}
    else if(minimo>0&&ip.fim<=minimo){sitClass="warn";}
    if(ip.ent===0&&ip.sai===0&&ip.fim===0&&ip.ini===0)return;
    itemsData.push({p:p,ip:ip,minimo:minimo,sitClass:sitClass});
  });
  var lowStockCount=itemsData.filter(function(d){return d.sitClass!=="ok";}).length;

  // ---- Entries table ----
  var entRows="";
  ent.slice().sort(function(a,b){return a.data.localeCompare(b.data);}).forEach(function(m){
    var p=PRODUTOS.find(function(x){return x.id===m.produtoId;});
    if(!p)return;
    var cu=m.custoUnit?("R$ "+m.custoUnit.toFixed(2).replace(".",",")):"\u2014";
    entRows+="<tr>"
      +"<td>"+esc(p.descricao)+"</td>"
      +"<td>"+esc(m.cor||"\u2014")+"</td>"
      +"<td>"+esc(m.tamanho||"\u2014")+"</td>"
      +"<td>"+esc(m.parte||"\u2014")+"</td>"
      +"<td>"+fmtD(m.data)+"</td>"
      +'<td class="r pos">+'+m.qtd+"</td>"
      +'<td class="r">'+cu+"</td>"
      +"</tr>";
  });
  if(!entRows)entRows='<tr><td colspan="7" class="empty">Nenhuma entrada no per\u00edodo.</td></tr>';

  // ---- Exits table ----
  var saiRows="";
  sai.slice().sort(function(a,b){return a.data.localeCompare(b.data);}).forEach(function(m){
    var p=PRODUTOS.find(function(x){return x.id===m.produtoId;});
    if(!p)return;
    saiRows+="<tr>"
      +"<td>"+esc(p.descricao)+"</td>"
      +"<td>"+esc(m.cor||"\u2014")+"</td>"
      +"<td>"+esc(m.tamanho||"\u2014")+"</td>"
      +"<td>"+esc(m.parte||"\u2014")+"</td>"
      +"<td>"+esc(m.liberadoPor||"\u2014")+"</td>"
      +"<td>"+fmtD(m.data)+"</td>"
      +'<td class="r neg">\u2212'+m.qtd+"</td>"
      +"</tr>";
  });
  if(!saiRows)saiRows='<tr><td colspan="7" class="empty">Nenhuma sa\u00edda no per\u00edodo.</td></tr>';

  // ---- Balance table ----
  var balRows="";
  itemsData.forEach(function(d){
    var p=d.p,ip=d.ip,minimo=d.minimo,sitClass=d.sitClass;
    var situacao=sitClass==="danger"?"Estoque baixo":sitClass==="warn"?"Aten\u00e7\u00e3o":"Regular";
    var ca=dom==="safety"?caAtualProduto(p.id):"";
    var caTag=ca?(' <small style="color:#888;font-size:9px">CA '+esc(ca)+"</small>"):"";
    var finCls=ip.fim<=0?"neg":ip.fim<=(minimo||0)?"warn":"pos";
    balRows+="<tr>"
      +"<td>"+esc(p.descricao)+caTag+"</td>"
      +"<td>"+esc(p.unidade||"UN")+"</td>"
      +'<td class="r">'+(minimo||"\u2014")+"</td>"
      +'<td class="r num">'+ip.ini+"</td>"
      +'<td class="r pos">+'+(ip.ent||0)+"</td>"
      +'<td class="r neg">\u2212'+(ip.sai||0)+"</td>"
      +'<td class="r '+finCls+'">'+ip.fim+"</td>"
      +'<td><span class="badge '+sitClass+'">'+situacao+"</span></td>"
      +"</tr>";
  });
  if(!balRows)balRows='<tr><td colspan="8" class="empty">Nenhum item com movimenta\u00e7\u00e3o.</td></tr>';

  // ---- Collaborator report ----
  var colabMap={};
  sai.forEach(function(m){
    var nome=m.parte||"";
    if(!nome)return;
    if(!colabMap[nome])colabMap[nome]=[];
    colabMap[nome].push(m);
  });

  var intervalSummary={};
  var colabSections="";

  Object.keys(colabMap).sort().forEach(function(nome){
    var movs=colabMap[nome].slice().sort(function(a,b){return a.data.localeCompare(b.data);});
    var colabObj=COLABORADORES.find(function(c){return c.nome===nome;});
    var meta=colabObj?[colabObj.setor||colabObj.funcao||"",colabObj.turno||"",colabObj.unidade||""].filter(Boolean).join(" \u00b7 "):"";

    var rows="";
    movs.forEach(function(m){
      var p=PRODUTOS.find(function(x){return x.id===m.produtoId;});
      if(!p)return;

      // Find most recent previous withdrawal of same product by same person (case-insensitive)
      var _nomeLc=(nome||"").toLowerCase();
      var prevMovs=MOVS.filter(function(x){
        return (x.parte||"").toLowerCase()===_nomeLc&&x.produtoId===m.produtoId&&x.tipo==="saida"&&x.data<m.data;
      }).sort(function(a,b){return b.data.localeCompare(a.data);});

      var intervalHtml='<span class="int na">\u2014</span>';
      if(prevMovs.length>0){
        var d1=new Date(prevMovs[0].data+"T00:00:00");
        var d2=new Date(m.data+"T00:00:00");
        var diff=Math.round((d2-d1)/86400000);
        var icls=diff<10?"alert":diff<20?"warn":"ok";
        intervalHtml='<span class="int '+icls+'">'+diff+" dias</span>";
        if(!intervalSummary[m.produtoId])intervalSummary[m.produtoId]={nome:p.descricao,count:0,total:0,min:9999,minColab:""};
        intervalSummary[m.produtoId].count++;
        intervalSummary[m.produtoId].total+=diff;
        if(diff<intervalSummary[m.produtoId].min){intervalSummary[m.produtoId].min=diff;intervalSummary[m.produtoId].minColab=nome;}
      }

      rows+="<tr>"
        +"<td>"+esc(p.descricao)+"</td>"
        +"<td>"+esc(m.cor||"\u2014")+"</td>"
        +"<td>"+esc(m.tamanho||"\u2014")+"</td>"
        +"<td>"+fmtD(m.data)+"</td>"
        +"<td>"+esc(m.liberadoPor||"\u2014")+"</td>"
        +'<td class="r">'+m.qtd+"</td>"
        +'<td class="r">'+intervalHtml+"</td>"
        +"</tr>";
    });

    colabSections+='<div class="sec-label">'+esc(nome)+(meta?' <span class="sec-meta">\u2014 '+esc(meta)+"</span>":"")+"</div>"
      +'<div style="overflow-x:auto"><table>'
      +"<thead><tr>"
      +"<th>Item / EPI</th><th>Tipo / Cor</th><th>Tam.</th><th>Data retirada</th><th>Liberado por</th><th class='r'>Qtd.</th><th class='r'>Intervalo anterior</th>"
      +"</tr></thead><tbody>"+rows+"</tbody></table></div>";
  });

  if(!colabSections)colabSections='<div class="empty" style="padding:20px 0">Nenhuma retirada de colaboradores no per\u00edodo.</div>';

  // ---- Interval summary ----
  var summaryRows="";
  Object.values(intervalSummary).sort(function(a,b){return a.nome.localeCompare(b.nome,"pt-BR");}).forEach(function(s){
    var avg=Math.round(s.total/s.count);
    var minCls=s.min<10?"alert":s.min<20?"warn":"ok";
    var alertBadge=s.min<10?'<span class="badge danger">Verificar '+esc(s.minColab.split(" ")[0])+"</span>"
                  :s.min<20?'<span class="badge warn">Aten\u00e7\u00e3o</span>'
                  :'<span class="badge ok">Normal</span>';
    summaryRows+="<tr>"
      +"<td>"+esc(s.nome)+"</td>"
      +'<td class="r">'+s.count+"</td>"
      +'<td class="r">'+avg+" dias</td>"
      +'<td class="r"><span class="int '+minCls+'">'+s.min+" dias</span></td>"
      +"<td>"+alertBadge+"</td>"
      +"</tr>";
  });
  if(!summaryRows)summaryRows='<tr><td colspan="5" class="empty">Sem intervalos calculados no per\u00edodo.</td></tr>';

  var unidTitulo=repUnidade==="geral"?"Todas as unidades":"Unidade "+repUnidade;
  var domTitulo=dom==="safety"?"EPI / Safety":"Uniformes";
  var saldoPeriodo=qtdEnt-qtdSai;

/* ================= UI: TOAST + MODAL ================= */
function toast(msg,type){
  var box=document.getElementById("toasts");
  if(!box){console.log("toast:",msg);return;}
  var t=document.createElement("div");
  t.className="toast"+(type?(" "+type):"");
  t.textContent=String(msg==null?"":msg);
  box.appendChild(t);
  setTimeout(function(){
    t.style.transition="opacity .3s, transform .3s";
    t.style.opacity="0";t.style.transform="translateX(40px)";
    setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},320);
  },3000);
}

function openModal(title, bodyHTML, buttons){
  var overlay=document.getElementById("overlay");
  var modal=document.getElementById("modal");
  if(!overlay||!modal)return;
  modal.innerHTML="";
  var head=document.createElement("div");head.className="modal-head";
  var h3=document.createElement("h3");h3.textContent=title||"";
  var x=document.createElement("button");x.className="x";x.innerHTML="&times;";
  x.onclick=function(){closeModal();};
  head.appendChild(h3);head.appendChild(x);
  var body=document.createElement("div");body.className="modal-body";
  body.innerHTML=bodyHTML||"";
  modal.appendChild(head);modal.appendChild(body);
  var list=buttons||[];
  if(list.length){
    var foot=document.createElement("div");foot.className="modal-foot";
    list.forEach(function(b){
      var btn=document.createElement("button");
      btn.className="btn "+(b.cls||"ghost")+" sm";
      btn.innerHTML=b.label||"";
      btn.onclick=function(){
        if(btn._busy)return; // impede duplo clique enquanto processa
        try{
          var r=b.act&&b.act();
          if(r&&typeof r.then==="function"){
            btn._busy=true;
            btn.classList.add("is-busy");
            var _oldHtml=btn.innerHTML, _oldDis=btn.disabled;
            btn.disabled=true;
            r.catch(function(e){console.error(e);}).then(function(){
              // Reabilita s\u00f3 se o bot\u00e3o ainda existir no DOM (modal n\u00e3o fechou)
              if(btn.isConnected){btn._busy=false;btn.classList.remove("is-busy");btn.disabled=_oldDis;btn.innerHTML=_oldHtml;}
            });
          }
        }
        catch(e){console.error(e);btn._busy=false;btn.classList.remove("is-busy");}
      };
      foot.appendChild(btn);
    });
    modal.appendChild(foot);
  }
  overlay.classList.add("show");
  overlay.onclick=function(e){if(e.target===overlay)closeModal();};
}

function closeModal(){
  if(typeof _wz_pararCamera==="function"){try{_wz_pararCamera();}catch(e){}}
  var overlay=document.getElementById("overlay");
  var modal=document.getElementById("modal");
  if(overlay){overlay.classList.remove("show");overlay.onclick=null;}
  if(modal)modal.innerHTML="";
}

function confirmModal(title, msgHTML, confirmLabel){
  return new Promise(function(resolve){
    var done=false;
    function finish(v){if(done)return;done=true;closeModal();resolve(v);}
    openModal(title,
      '<div style="font-size:14px;line-height:1.55;color:var(--txt)">'+(msgHTML||"")+'</div>',
      [{label:"Cancelar",cls:"ghost",act:function(){finish(false);}},
       {label:confirmLabel||"Confirmar",cls:"danger",act:function(){finish(true);}}]);
    var overlay=document.getElementById("overlay");
    if(overlay)overlay.onclick=function(e){if(e.target===overlay)finish(false);};
    var x=document.querySelector(".modal-head .x");
    if(x)x.onclick=function(){finish(false);};
  });
}

/* ================= EXPORTAR CSV ================= */
function exportCSV(){
  try{
    var dom=state.dom;
    var rows=MOVS.filter(function(m){return m.dom===dom;});
    if(_repRange&&_repRange.start&&_repRange.end){
      rows=rows.filter(function(m){return m.data>=_repRange.start&&m.data<=_repRange.end;});
    }
    rows=rows.slice().sort(function(a,b){return a.data<b.data?1:(a.data>b.data?-1:0);});
    if(!rows.length){toast("N\u00e3o h\u00e1 movimenta\u00e7\u00f5es para exportar.","warn");return;}
    var head=["Data","Tipo","Produto","Parte/Colaborador","Quantidade","Tamanho","Cor","Custo Unit.","Liberado Por","Observacoes"];
    function cell(v){v=(v==null?"":String(v));if(/[";\n\r]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
    var lines=[head.join(";")];
    rows.forEach(function(m){
      var p=(typeof PRODUTOS!=="undefined")?PRODUTOS.find(function(x){return x.id===m.produtoId;}):null;
      lines.push([m.data,(m.tipo==="entrada"?"Entrada":"Sa\u00edda"),p?p.descricao:m.produtoId,
        m.parte||"",m.qtd,m.tamanho||"",m.cor||"",m.custoUnit||0,m.liberadoPor||"",m.obs||""].map(cell).join(";"));
    });
    var csv="\ufeff"+lines.join("\r\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="movimentacoes_"+dom+"_"+today()+".csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    toast("CSV exportado.","ok");
  }catch(e){toast("Erro ao exportar CSV: "+e.message,"erro");}
}

function act(a){
  if(a==="novoProd")formProduto(null);
  else if(a==="editProd"&&selProd())formProduto(selProd());
  else if(a==="delProd")delProduto();
  else if(a==="entrada"&&selProd())formMov("entrada");
  else if(a==="saida"&&selProd())formMov("saida");
  else if(a==="ajusteEstoque"&&selProd())formAjusteEstoque();
  else if(a==="novaEntrega")formEntrega("");
  else if(a==="csv")exportCSV();
}

/* ---- Ajuste de Estoque (corre\u00e7\u00e3o direta de saldo, sem nova entrada/sa\u00edda manual) ---- */
function formAjusteEstoque(){
  if(!canEdit()){toast("Apenas admin/operador podem ajustar estoque","erro");return;}
  const p=selProd();if(!p)return;
  const temTam=!!(p.tamanhos&&p.tamanhos.length);
  const temCor=!!(p.cores&&p.cores.length);
  const tamOpts=temTam?`<div class="mfield"><label>Tamanho <span class="req">*</span></label><select id="aj_tam"><option value="">\u2014 selecione \u2014</option>${p.tamanhos.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>`:"";
  const corOpts=temCor?`<div class="mfield"><label>Tipo/Modelo <span class="req">*</span></label><select id="aj_cor"><option value="">\u2014 selecione \u2014</option>${p.cores.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`:"";
  let body='<div style="font-size:12px;color:var(--txt-dim);margin-bottom:10px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:9px 12px">'
    +'Corrige o saldo do produto diretamente \u2014 sem precisar lan\u00e7ar uma nova entrada. A diferen\u00e7a \u00e9 registrada automaticamente no perfil <b>Expurgo</b>, para auditoria no relat\u00f3rio.'
    +'</div>'
    +'<div class="mgrid">'+corOpts+tamOpts
    +'<div class="mfield"><label>Saldo atual</label><input id="aj_saldo_atual" readonly value="'+((temTam||temCor)?"\u2014":atual(p.id))+'"></div>'
    +'<div class="mfield"><label>Novo saldo <span class="req">*</span></label><input type="number" id="aj_novo" min="0" step="1" placeholder="Informe o saldo correto" '+((temTam||temCor)?"disabled":"")+'></div>'
    +'<div class="mfield full"><label>Motivo do ajuste <span class="req">*</span></label><input id="aj_motivo" placeholder="Ex: contagem f\u00edsica, corre\u00e7\u00e3o de lan\u00e7amento\u2026"></div>'
    +'</div>';
  openModal("Ajustar Estoque \u00b7 "+esc(p.descricao),body,[
    {label:"Cancelar",cls:"ghost",act:closeModal},
    {label:"Aplicar Ajuste",cls:"primary",act:submitAjusteEstoque}
  ]);
  setTimeout(function(){
    var elTam=document.getElementById("aj_tam"),elCor=document.getElementById("aj_cor"),
        elAtual=document.getElementById("aj_saldo_atual"),elNovo=document.getElementById("aj_novo");
    function upd(){
      if(temTam&&elTam&&!elTam.value){elAtual.value="\u2014";if(elNovo)elNovo.disabled=true;return;}
      if(temCor&&elCor&&!elCor.value){elAtual.value="\u2014";if(elNovo)elNovo.disabled=true;return;}
      var tamSel=temTam?elTam.value:"";
      var corSel=temCor?elCor.value:"";
      var s=temTam?saldoVar(p.id,tamSel,corSel):(temCor?saldoVar(p.id,"",corSel):atual(p.id));
      elAtual.value=s;
      if(elNovo){elNovo.disabled=false;if(!elNovo.value)elNovo.value=s;}
    }
    if(elTam)elTam.onchange=upd;
    if(elCor)elCor.onchange=upd;
    upd();
  },0);
}
async function submitAjusteEstoque(){
  const p=selProd();if(!p)return;
  const temTam=!!(p.tamanhos&&p.tamanhos.length);
  const temCor=!!(p.cores&&p.cores.length);
  const tam=temTam?val("aj_tam"):"";
  const cor=temCor?val("aj_cor"):"";
  if(temTam&&!tam){toast("Selecione o tamanho","erro");return;}
  if(temCor&&!cor){toast("Selecione o Tipo/Modelo","erro");return;}
  const motivo=val("aj_motivo").trim();
  if(!motivo){toast("Informe o motivo do ajuste","erro");return;}
  const novoStr=val("aj_novo");
  if(novoStr===""||isNaN(Number(novoStr))||Number(novoStr)<0){toast("Informe um saldo v\u00e1lido","erro");return;}
  const novo=Math.round(Number(novoStr));
  const atualSaldo=temTam?saldoVar(p.id,tam,cor):(temCor?saldoVar(p.id,"",cor):atual(p.id));
  const delta=novo-atualSaldo;
  if(delta===0){toast("O saldo informado j\u00e1 \u00e9 o saldo atual.","warn");return;}
  const u=getUser();
  const libNome=u?(u.nome||u.email||"Sistema"):"Sistema";
  const mov={id:uid(),_t:Date.now(),produtoId:p.id,dom:p.dom,
    tipo:delta>0?"entrada":"saida",
    data:today(),qtd:Math.abs(delta),tamanho:tam,cor,
    parte:"Expurgo",liberadoPor:libNome,usuario:libNome,genero:"Unissex",
    obs:"Ajuste de estoque: "+atualSaldo+" \u2192 "+novo+" \u2014 "+motivo
  };
  const r=await persistMov(mov);
  if(!r){toast("Erro ao salvar ajuste","erro");return;}
  MOVS.push(mov);
  closeModal();
  toast("Estoque ajustado: "+atualSaldo+" \u2192 "+novo,"ok");
  render();
}

function formMov(tipo){
  const p=selProd();if(!p)return;const isSai=tipo==="saida";

  const genOpts='<div class="mfield"><label>G\u00eanero</label><select id="m_genero"><option value="Unissex">Unissex</option><option value="Masc.">Masculino</option><option value="Fem.">Feminino</option></select></div>';

  body+=isSai?`<div class="mfield"><label>Colaborador (recebe) <span class="req">*</span></label><select id="m_parte"><option value="">\u2014 selecione \u2014</option>${colabList.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>`
              :`<div class="mfield"><label>Fornecedor</label><input id="m_parte" placeholder="Fornecedor / origem"></div>`;
  body+=tamOpts+corOpts+genOpts+`<div class="mfield"><label>Quantidade <span class="req">*</span></label><input type="number" id="m_qtd" min="1" step="1" value="1"></div>`;
  body+=isSai?`<div class="mfield"><label>Liberado por <span class="req">*</span></label><input id="m_lib" placeholder="Respons\u00e1vel"></div><div class="mfield"><label>Dispon\u00edvel</label><input id="m_disp" readonly value="\u2014"></div>`
              :`<div class="mfield"><label>Custo unit\u00e1rio (R$)</label><input type="number" id="m_cu" min="0" step="0.01" placeholder="0,00"></div><input type="hidden" id="m_user" value="">`;
  if(!isSai&&state.dom==="safety"){
    body+=`<div class="mfield full"><label>C.A. do EPI <span style="font-size:10px;color:var(--txt-faint)">(opcional)</span></label><input id="m_ca" inputmode="numeric" placeholder="N\u00ba do Certificado de Aprova\u00e7\u00e3o" value="${esc(p.ca||"")}"></div>`;
  }
  body+=`<div class="mfield full"><label>Observa\u00e7\u00f5es</label><input id="m_obs" placeholder="${isSai?"Ex: troca\u2026":"Ex: nota fiscal, lote\u2026"}"></div></div>`;
  openModal((isSai?"Sa\u00edda":"Entrada")+" \u00b7 "+esc(p.descricao),body,
    [{label:"Cancelar",cls:"ghost",act:closeModal},{label:isSai?"Registrar Sa\u00edda":"Registrar Entrada",cls:isSai?"primary":"green",act:()=>submitMov(tipo)}]);
  setTimeout(()=>{
    const upd=()=>{if(isSai){const d=document.getElementById("m_disp");if(d){const gt=document.getElementById("m_genero");const gen=gt?gt.value:"Unissex";const tt=document.getElementById("m_tam");const ct=document.getElementById("m_cor");const t2=tt?tt.value:"";const c2=ct?ct.value:"";d.value=(t2||c2||gen!=="Unissex")?saldoVarGen(p.id,t2,c2,gen):atual(p.id);}}chk();};
    ["m_tam","m_cor","m_genero"].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=upd;});
    if(isSai){const pe=document.getElementById("m_parte"),da=document.getElementById("m_data");if(pe)pe.onchange=chk;if(da)da.onchange=chk;}
    upd();
    // Populate admin user dropdown for entrada
    if(!isSai){
      // Auto-fill m_user com usu\u00e1rio logado
      var muSel=document.getElementById("m_user");
      if(muSel){var _cuEnt=getUser();if(_cuEnt)muSel.value=_cuEnt.nome||_cuEnt.email||"";}
    }
    function chk(){const box=document.getElementById("movAlert");if(!box)return;box.innerHTML="";if(!isSai)return;
      const parte=val("m_parte").trim(),data=val("m_data");if(!parte)return;
      const prev=MOVS.filter(m=>m.tipo==="saida"&&m.produtoId===p.id&&m.parte.trim().toLowerCase()===parte.toLowerCase()&&m.data<=data).sort((a,b)=>b.data>a.data?1:-1)[0];
      if(prev){const d=days(prev.data,data);if(d>=0&&d<ALERTA_DIAS)box.innerHTML=`<div class="alert-line">\u26a0\ufe0f <b>Retirada recente.</b> ${esc(parte)} j\u00e1 retirou <b>${esc(p.descricao)}</b> em <b>${fmtD(prev.data)}</b> (h\u00e1 ${d} dia${d===1?"":"s"}). Intervalo inferior a ${ALERTA_DIAS} dias.</div>`;}}
  },0);
}
async function submitMov(tipo){
  const p=selProd();if(!p)return;const isSai=tipo==="saida";
  const data=val("m_data"),qtd=Number(val("m_qtd")),parte=val("m_parte").trim();
  const tam=(p.tamanhos&&p.tamanhos.length)?val("m_tam"):"";
  const cor=(p.cores&&p.cores.length)?val("m_cor"):"";
  if(!data||!qtd||qtd<=0){toast("Informe data e quantidade","erro");return;}
  if(p.tamanhos&&p.tamanhos.length&&!tam){toast("Selecione o tamanho","erro");return;}
  if(p.cores&&p.cores.length&&!cor){toast("Selecione a cor/tipo","erro");return;}
  if(isSai){
    const lib=val("m_lib").trim();if(!parte||!lib){toast("Colaborador e liberado por obrigat\u00f3rios","erro");return;}
    const saldo=atual(p.id);if(qtd>saldo){toast(`Estoque insuficiente. Dispon\u00edvel: ${saldo}.`,"erro");return;}
    const prev=MOVS.filter(m=>m.tipo==="saida"&&m.produtoId===p.id&&m.parte.trim().toLowerCase()===parte.toLowerCase()&&m.data<=data).sort((a,b)=>b.data>a.data?1:-1)[0];
    if(prev){const d=days(prev.data,data);if(d>=0&&d<ALERTA_DIAS){const ok=await confirmModal("Retirada em intervalo curto",`<b>${esc(parte)}</b> retirou <b>${esc(p.descricao)}</b> em <b>${fmtD(prev.data)}</b> (h\u00e1 ${d} dia${d===1?"":"s"}). Registrar mesmo assim?`,"Registrar");if(!ok)return;}}
    var genSai=(document.getElementById("m_genero")||{}).value||"Unissex";var novaMov={id:uid(),_t:Date.now(),produtoId:p.id,dom:p.dom,tipo:"saida",data,qtd,tamanho:tam,cor,parte,liberadoPor:lib,obs:val("m_obs").trim(),genero:genSai};
    const r_s=await persistMov(novaMov);if(!r_s)return;
    MOVS.push(novaMov);
    closeModal();toast(`Sa\u00edda: ${qtd}\u00d7 ${p.descricao} \u2192 ${parte}`,"ok");render();
  }else{
    var caVal="", obsEnt=val("m_obs").trim();
    if(state.dom==="safety"){
      caVal=val("m_ca").trim();
      if(caVal){obsEnt="C.A. "+caVal+(obsEnt?(" \u2014 "+obsEnt):"");}
    }
    var genEnt=(document.getElementById("m_genero")||{}).value||"Unissex";var novaEnt={id:uid(),_t:Date.now(),produtoId:p.id,dom:p.dom,tipo:"entrada",data,qtd,tamanho:tam,cor,parte:parte||"\u2014",custoUnit:Number(val("m_cu"))||0,usuario:val("m_user").trim(),obs:obsEnt,ca:caVal,genero:genEnt};
    const r_e=await persistMov(novaEnt);if(!r_e)return;
    MOVS.push(novaEnt);
    // Memoriza o \u00faltimo C.A. no produto para pr\u00e9-preencher pr\u00f3ximas entradas
    if(caVal){p.ca=caVal;}
    closeModal();toast(`Entrada: ${qtd}\u00d7 ${p.descricao}`+(caVal?` (C.A. ${caVal})`:""),"ok");render();
  }
}

/* \u2500\u2500 helper: barra de progresso wizard \u2500\u2500 */
function _wz_steps(ativo){
  var defs=[["1","Dados"],["2","Foto"],["3","Assinatura"]];
  var html='<div style="display:flex;gap:8px;margin-bottom:16px">';
  for(var i=0;i<defs.length;i++){
    var idx=i+1, n=defs[i][0], l=defs[i][1];
    var bg,col,lbl;
    if(idx<ativo){bg="var(--green)";col="#fff";lbl="&#10003; "+l;}
    else if(idx===ativo){bg="var(--blue)";col="#fff";lbl=n+". "+l;}
    else{bg="#eef1f5";col="var(--txt-faint)";lbl=n+". "+l;}
    html+='<div style="flex:1;text-align:center;padding:6px 0;border-radius:6px;font-size:11px;font-weight:700;background:'+bg+';color:'+col+';letter-spacing:.05em">'+lbl+'</div>';
  }
  return html+'</div>';
}
