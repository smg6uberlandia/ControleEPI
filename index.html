<title>Controle de Estoque &#183; SMG6</title>

<style>
  :root{
    --blue:#2D3277;--blue-d:#1e2255;--blue-l:#e8e9f5;--blue-sel:#d5d7ef;
    --ml-yellow:#FFE600;--ml-yellow-d:#e6cf00;
    --bg:#f4f5f7;--panel:#ffffff;--line:#d3dae4;--line-soft:#e6ebf1;
    --txt:#1d2733;--txt-dim:#5b6675;--txt-faint:#8b94a3;
    --green:#1f9d55;--green-bg:#e3f5ea;--red:#d23b30;--red-bg:#fbe5e3;
    --amber:#b8860b;--amber-bg:#fdf3da;
    --mono:"IBM Plex Mono",monospace;--disp:"Archivo",sans-serif;--body:"IBM Plex Sans",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:13.5px;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#c3ccd8;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#aab6c6}
  .app{display:flex;flex-direction:column;min-height:100vh}
  header{background:var(--ml-yellow);color:var(--blue);display:flex;align-items:center;padding:0 18px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mark{height:51px;width:auto;display:block}
  .logo h1{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.2px;color:var(--blue)}
  .logo .u{font-family:var(--mono);font-size:10px;opacity:.7;letter-spacing:.15em;margin-top:1px;color:var(--blue)}
  .dom-tabs{display:flex;margin-left:26px;gap:3px}
  .dom-tab{background:rgba(45,50,119,.12);border:none;color:var(--blue);padding:8px 20px;border-radius:7px 7px 0 0;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:.13s;opacity:.75}
  .dom-tab:hover{opacity:1;background:rgba(45,50,119,.2)}
  .dom-tab.active{background:var(--bg);color:var(--blue-d);opacity:1}
  .head-right{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--blue);display:flex;gap:18px;align-items:center}
  .menu{background:#f6f8fb;border-bottom:1px solid var(--line);display:flex;padding:0 14px;gap:2px}
  .menu button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--txt-dim);cursor:pointer;transition:.12s}
  .menu button:hover{color:var(--txt)}
  .menu button.active{color:var(--blue);border-bottom-color:var(--blue)}
  main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
  .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;padding:8px 10px;gap:6px;flex-wrap:wrap}
  .tbtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;font-family:var(--body);font-weight:600;font-size:13px;color:var(--txt);transition:.12s}
  .tbtn:hover{border-color:var(--blue);background:#f3f8ff;color:var(--blue-d)}
  .tbtn:disabled{opacity:.4;cursor:not-allowed;background:#fff}
  .mfield select:disabled,.mfield input:disabled,.field-locked{opacity:.45;cursor:not-allowed;background:#f2f3f5}
  .btn.is-busy{opacity:.7;cursor:wait}
  .tbtn:disabled:hover{border-color:var(--line);color:var(--txt)}
  .tbtn .ic{font-size:15px;line-height:1}
  .tbtn .k{font-family:var(--mono);font-size:9.5px;color:var(--txt-faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:2px}
  .tb-green:hover{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .tb-red:hover{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .tb-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
  .selbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;gap:14px;padding:11px 14px;flex-wrap:wrap}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);font-weight:600}
  .fg input,.fg select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--body);font-size:14px;background:#fff;color:var(--txt)}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,184,.12)}
  .fg.grow{flex:1;min-width:260px}
  .fg.grow select{width:100%;font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .panel-bar{background:#f6f8fb;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px}
  .panel-bar h3{font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-dim)}

  .scroll-y{overflow:auto}
  .detail .scroll-y{max-height:340px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:#eef2f7;text-align:left;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--txt-dim);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}

  .empty{padding:34px;text-align:center;color:var(--txt-faint)}
  .empty .big{font-size:26px;opacity:.4;margin-bottom:6px}
  .qpos{color:var(--green);font-weight:600}.qneg{color:var(--red);font-weight:600}

  .chip.ent{background:var(--green-bg);color:var(--green);border-color:#bfe6cd}

  .chip.desl{background:var(--red-bg);color:var(--red);border-color:#f5c6c2}
  .cdot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.2);margin-right:5px;vertical-align:-1px}
  .icon-btn{background:#fff;border:1px solid var(--line);border-radius:6px;width:27px;height:27px;cursor:pointer;color:var(--txt-dim);font-size:13px;transition:.12s}
  .icon-btn:hover{border-color:var(--blue);color:var(--blue)}
  .icon-btn.del:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
  .totals{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;display:flex;flex-wrap:wrap;padding:11px 16px;gap:30px}
  .tot{display:flex;flex-direction:column}
  .tot .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);font-weight:600}
  .tot .v{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--txt);margin-top:2px}
  .tot .v.blue{color:var(--blue)}.tot .v.green{color:var(--green)}.tot .v.red{color:var(--red)}
  .btn{border:none;border-radius:7px;padding:9px 18px;font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;gap:7px}
  .btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
  .btn.green{background:var(--green);color:#fff}.btn.green:hover{filter:brightness(.93)}
  .btn.ghost{background:#fff;color:var(--txt-dim);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn.danger{background:var(--red);color:#fff}.btn.danger:hover{filter:brightness(.95)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
  .seg button{background:none;border:none;color:var(--txt-dim);padding:7px 14px;font-family:var(--body);font-weight:600;font-size:12.5px;cursor:pointer}
  .seg button:not(:last-child){border-right:1px solid var(--line)}
  .seg button.active{background:var(--blue);color:#fff}
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:12px;width:100%;max-width:600px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal-head{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center}
  .modal-head h3{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
  .modal-head .x{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:17px}
  .modal-head .x:hover{background:rgba(255,255,255,.35)}
  .modal-body{padding:20px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mfield{display:flex;flex-direction:column;gap:5px}
  .mfield.full{grid-column:1/-1}
  .mfield label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-dim);font-weight:600}
  .mfield label .req{color:var(--red)}
  .mfield input,.mfield select,.mfield textarea{border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--body);font-size:14px;background:#fff;color:var(--txt);width:100%}
  .mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,184,.12)}
  .mfield input[readonly]{background:#f1f4f8;color:var(--blue);font-family:var(--mono);font-weight:600}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
  .alert-line{background:var(--amber-bg);border:1px solid #ecd9a3;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;color:#7a5a08}
  .alert-line b{color:var(--amber)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:3px solid var(--blue)}
  .stat.green{border-left-color:var(--green)}.stat.red{border-left-color:var(--red)}.stat.amber{border-left-color:var(--amber)}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-faint);font-weight:600}
  .stat .v{font-family:var(--disp);font-weight:800;font-size:27px;margin-top:5px}
  .stat .v small{font-size:13px;color:var(--txt-dim);font-weight:600}
  .stat .m{font-size:11.5px;color:var(--txt-dim);margin-top:2px}
  .colab-det{padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  #toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px}
  .toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);padding:12px 17px;border-radius:8px;min-width:230px;box-shadow:0 8px 26px rgba(0,0,0,.16);font-size:13.5px;font-weight:500;animation:sl .25s}
  .toast.ok{border-left-color:var(--green)}.toast.erro{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
  @keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  .loading{padding:50px;text-align:center;color:var(--txt-faint);font-family:var(--mono);letter-spacing:.1em}
  details>summary::-webkit-details-marker{display:none}
  details[open]>summary .det-arrow{transform:rotate(90deg)}
  .det-arrow{display:inline-block;transition:transform .2s}
  .colab-select-wrap{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .colab-select-wrap select{border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--body);font-size:14px;min-width:280px;background:#fff;color:var(--txt)}
  .colab-select-wrap select:focus{outline:none;border-color:var(--blue)}
  /* ===== Relat\f3 rios visuais ===== */
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.rep-grid{grid-template-columns:1fr}}
  .itembar{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
  .itembar:last-child{border-bottom:none}
  .itembar .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
  .itembar .nm{font-weight:600;font-size:13.5px;color:var(--txt);display:flex;align-items:center;gap:7px}
  .itembar .nm .ca{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--blue);background:var(--blue-l);padding:1px 6px;border-radius:9px}
  .itembar .sd{font-family:var(--disp);font-weight:800;font-size:15px}
  .itembar .sd small{font-size:10.5px;color:var(--txt-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .track{position:relative;height:26px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex}
  .track .bar{height:100%;display:flex;align-items:center;justify-content:flex-end;padding:0 7px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:0;white-space:nowrap}
  .track .bar.ent{background:linear-gradient(90deg,#1f9d55,#27b863)}
  .track .bar.sai{background:linear-gradient(90deg,#d23b30,#e8554a)}
  .itembar .meta{display:flex;gap:16px;margin-top:6px;font-size:11.5px;color:var(--txt-dim)}
  .itembar .meta b{font-family:var(--mono)}
  .legend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--txt-dim);margin-left:auto}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .legend .dot.ent{background:#27b863}.legend .dot.sai{background:#e8554a}
  .repsearch{border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-family:var(--body);font-size:13.5px;background:#fff;color:var(--txt);min-width:200px}
  .repsearch:focus{outline:none;border-color:var(--blue)}
  .miniflow{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
  .miniflow .pill{padding:2px 9px;border-radius:12px;font-weight:700;border:1px solid var(--line)}
  .miniflow .pill.ini{background:#eef1f6;color:var(--txt-dim)}
  .miniflow .pill.ent{background:var(--green-bg);color:var(--green)}
  .miniflow .pill.sai{background:var(--red-bg);color:var(--red)}
  .miniflow .pill.fim{background:var(--blue);color:#fff;border-color:var(--blue)}
  .miniflow .op{color:var(--txt-faint);font-weight:700}
  .donut-wrap{display:flex;align-items:center;gap:18px;padding:16px}
  .barcol{display:flex;align-items:flex-end;gap:10px;height:170px;padding:16px 14px 6px}
  .barcol .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .barcol .col .stack{width:100%;max-width:46px;border-radius:5px 5px 0 0;transition:height .5s cubic-bezier(.4,0,.2,1);position:relative}
  .barcol .col .cap{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--txt)}
  .barcol .col .xl{font-size:10.5px;color:var(--txt-faint);text-align:center;line-height:1.2}
/* ===== DASHBOARD ===== */
.dash-title{font-family:var(--disp);font-weight:800;font-size:18px;text-align:center;color:var(--blue);letter-spacing:.04em;margin:6px 0 16px;text-transform:uppercase}
.dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.dash-card.kpi-big{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.05)}

.dash-card.kpi-big.alt .ic{background:#e7f6ee}
.dash-card.kpi-big.alt2 .ic{background:#fdf3e3}
.dash-card.kpi-big.alt3 .ic{background:#eef0fb}
.dash-card.kpi-big .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-dim);font-weight:700;margin-bottom:2px}
.dash-card.kpi-big .num{font-family:var(--disp);font-weight:800;font-size:32px;color:var(--blue);line-height:1}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.dash-tbl{width:100%;border-collapse:collapse;font-size:13px}
.dash-tbl thead th{position:sticky;top:0;background:#f6f8fb;text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-dim);border-bottom:1px solid var(--line)}
.dash-tbl th.n,.dash-tbl td.n{text-align:right}
.dash-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.dash-tbl td.nm{font-weight:600}
.dash-buy .panel-bar h3{color:var(--blue)}
@media(max-width:820px){.dash-kpis{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}}

<div class="app" id="app" style="display:none">

/* \u2500\u2500 Google Sheets / Apps Script \u2500\u2500 */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJT0rKC9AtHeBCEDT2aQ_nTfLLJVO8shmOXey7pW-q-HQRSS-3_8dbyAvgyYGXVsGc/exec"; // linha 192 \u2014 cole a URL do Apps Script da conta @gmail.com

/* \u2500\u2500 API Helper via JSONP \u2500\u2500
   Dom\u00ednios Google Workspace bloqueiam fetch cross-origin mesmo com "Qualquer pessoa".
   JSONP contorna isso injetando uma tag de script \u2014 funciona em qualquer dom\u00ednio. */
function _hostedNoAppsScript(){return !!(window.google&&google.script&&google.script.run&&typeof google.script.run.apiCall==="function");}
function api(action, payload, silent) {
  return new Promise(function(resolve) {
    // Hospedado no Apps Script: usa a chamada interna (sem CORS/JSONP)
    if(_hostedNoAppsScript()){
      if(!silent) driveSetStatus("syncing");
      var _done=false;
      var _to=setTimeout(function(){
        if(_done)return;_done=true;
        if(!silent) driveSetStatus("error");
        resolve({ok:false,error:"Tempo esgotado. Verifique a conex\u00e3o."});
      },60000);
      google.script.run
        .withSuccessHandler(function(s){
          if(_done)return;_done=true;clearTimeout(_to);
          var d;try{d=JSON.parse(s);}catch(e){d={ok:false,error:"Resposta inv\u00e1lida do servidor."};}
          if(!silent) driveSetStatus(d&&d.ok?"ok":"error");
          resolve(d||{ok:false,error:"Resposta vazia do servidor."});
        })
        .withFailureHandler(function(err){
          if(_done)return;_done=true;clearTimeout(_to);
          if(!silent) driveSetStatus("error");
          resolve({ok:false,error:"Erro ao conectar: "+((err&&err.message)||err)});
        })
        .apiCall(JSON.stringify({action:action,token:localStorage.getItem("smg6_token"),payload:payload}));
      return;
    }
    const token = localStorage.getItem("smg6_token");
    if (!silent) driveSetStatus("syncing");

    // Nome \u00fanico para o callback
    const cbName = "__smg6cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);

    // Timeout de 20 segundos
    const timeout = setTimeout(function() {
      cleanup();
      if (!silent) driveSetStatus("error");
      resolve({ ok: false, error: "Tempo esgotado. Verifique a conex\u00e3o e a URL do Apps Script." });
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      const el = document.getElementById(cbName);
      if (el) el.remove();
    }

    // Registrar callback global que o Apps Script vai chamar
    window[cbName] = function(data) {
      cleanup();
      if (!silent) driveSetStatus(data && data.ok ? "ok" : "error");
      resolve(data || { ok: false, error: "Resposta vazia do servidor." });
    };

    // Montar URL com payload + callback
    const body = { action: action, token: token, payload: payload };
    const encoded = encodeURIComponent(JSON.stringify(body));
    const url = APPS_SCRIPT_URL + "?callback=" + cbName + "&payload=" + encoded;

    // Injetar script tag
    const script = document.createElement("script");
    script.id = cbName;
    script.src = url;
    script.onerror = function() {
      cleanup();
      if (!silent) driveSetStatus("error");
      resolve({ ok: false, error: "Erro ao conectar. Verifique se a implanta\u00e7\u00e3o est\u00e1 ativa e acess\u00edvel." });
    };
    document.head.appendChild(script);
  });
}

/* \u2500\u2500 Auth helpers \u2500\u2500 */
function getToken(){ return localStorage.getItem("smg6_token"); }
function getUser(){
  try{ return JSON.parse(localStorage.getItem("smg6_user")||"null"); }catch(e){return null;}
}
function setSession(token, user){
  localStorage.setItem("smg6_token", token);
  localStorage.setItem("smg6_user", JSON.stringify(user));
}
function clearSession(){
  localStorage.removeItem("smg6_token");
  localStorage.removeItem("smg6_user");
}
/* \u2500\u2500 Colaborador cache (localStorage) \u2500\u2500
   Preserva campos extras (unidade, genero, etc.) caso o backend n\u00e3o os retorne */
const COLAB_CACHE_KEY="smg6_colab_cache";
function _colabCacheGet(){try{return JSON.parse(localStorage.getItem(COLAB_CACHE_KEY)||"{}")||{};}catch(e){return {};}}
function _colabCacheSet(cache){try{localStorage.setItem(COLAB_CACHE_KEY,JSON.stringify(cache));}catch(e){}}
function colabCacheSave(obj){if(!obj||!obj.id)return;var ch=_colabCacheGet();ch[obj.id]=obj;_colabCacheSet(ch);}
function colabCacheMerge(arr){
  var ch=_colabCacheGet();
  // Backend sempre tem precedencia. Cache so preenche campos que o backend NAO enviou.
  var merged=arr.map(function(c){
    var cached=ch[c.id];
    if(!cached) return c;
    var m=Object.assign({},cached,c); // backend (c) sobrescreve cache
    if(!m.unidade && cached.unidade) m.unidade=cached.unidade;
    if(!m.genero  && cached.genero)  m.genero =cached.genero;
    if(!m.turno   && cached.turno)   m.turno  =cached.turno;
    return m;
  });
  Object.keys(ch).forEach(function(id){
    if(!merged.find(function(c){return c.id===id;})){
      merged.push(ch[id]);
    }
  });
  var seenMap={};
  var result=[];
  merged.forEach(function(x){
    var key=(x.nome||"").toLowerCase();
    if(seenMap[key]===undefined){
      seenMap[key]=result.length;
      result.push(x);
    } else {
      var prev=result[seenMap[key]];
      if((x.unidade||x.genero||x.turno)&&!(prev.unidade||prev.genero||prev.turno)){
        result[seenMap[key]]=x;
      }
    }
  });
  // Sincroniza cache local com resultado final para nao ficar obsoleto
  var newCache={};
  result.forEach(function(c){if(c.id) newCache[c.id]=c;});
  _colabCacheSet(newCache);
  return result;
}

/* C\u00f3digo de valida\u00e7\u00e3o curto e leg\u00edvel derivado do id da movimenta\u00e7\u00e3o (ex.: EPI-7F3A-9K2C) */
function gerarCodigoValidacao(seed){
  var base=String(seed||uid()).toUpperCase().replace(/[^A-Z0-9]/g,"");
  // mistura simples para distribuir os caracteres
  var h=0;for(var i=0;i<base.length;i++){h=(h*31+base.charCodeAt(i))>>>0;}
  var alf="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem caracteres amb\u00edguos (0/O/1/I)
  var out="";var n=h;
  for(var k=0;k<8;k++){out+=alf[n%alf.length];n=Math.floor(n/alf.length)+((base.charCodeAt(k%base.length)||7)*7);}
  return "EPI-"+out.slice(0,4)+"-"+out.slice(4,8);
}

const fmtD=d=>{
  if(!d)return"\u2014";

  if(/^\d{4}-\d{2}-\d{2}/.test(s)){var[y,m,dd]=s.slice(0,10).split("-");return dd+"/"+m+"/"+y;}
  // Formato Date.toString() "Sat May 30 2026..."
  try{var dt=new Date(s);if(!isNaN(dt.getTime())){
    var dd2=String(dt.getDate()).padStart(2,"0");
    var mm2=String(dt.getMonth()+1).padStart(2,"0");
    return dd2+"/"+mm2+"/"+dt.getFullYear();
  }}catch(e){}
  return s;
};

function caAtualProduto(pid){
  if(!pid)return"";
  var ents=movOf(pid).filter(function(m){return m.tipo==="entrada";})
    .sort(function(a,b){return (b._t||0)-(a._t||0);});
  for(var i=0;i<ents.length;i++){
    var m=ents[i];
    if(m.ca)return m.ca;
    if(m.obs){var mm=String(m.obs).match(/C\.?A\.?\s*[:n\u00ba]*\s*([0-9][0-9.\-\/]*)/i);if(mm)return mm[1];}

function colabListaAtivos(dom,unidade,turno){
  const fromSheets=COLABORADORES.filter(c=>c.ativo!==false).map(c=>c.nome);
  const fromMovs=[...new Set(MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom).map(m=>m.parte))].filter(Boolean);
  const fromPlanilha=dom==="safety"?COLAB_PLANILHA_ATIVOS:[];
  const base=fromSheets.length>0?fromSheets:[...new Set([...fromPlanilha,...fromMovs])];
  // Deduplicar por nome normalizado (case-insensitive): mant\u00e9m vers\u00e3o corretamente capitalizada
  var _seenNames={};
  var _deduped=[];
  base.forEach(function(n){var k=(n||"").toLowerCase();if(!_seenNames[k]){_seenNames[k]=n;_deduped.push(n);}});
  let lista=_deduped.filter(n=>!DESLIGADOS.some(d=>d.toLowerCase()===n.toLowerCase()));
  // Expurgo \u00e9 perfil fixo do sistema \u2014 nunca filtrar por unidade/turno
  var _temExpurgo=lista.some(function(n){return isExpurgo(n);});
  lista=lista.filter(function(n){return !isExpurgo(n);});
  if(unidade){lista=lista.filter(function(n){return colabUnidadeOf(n)===unidade;});}
  if(unidade==="SMG6"&&turno){lista=lista.filter(function(n){var t=colabTurnoOf(n);return !t||t===turno;});}
  lista=lista.sort((a,b)=>a.localeCompare(b,"pt-BR"));
  // Sempre inclui Expurgo no topo (apenas Safety), independente dos filtros
  if(dom==="safety"){lista.unshift("Expurgo");}
  return lista;
}
function mesLabel(ym){const[y,m]=ym.split("-");return MESES[Number(m)-1]+"/"+y;}
function monthRange(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return{start:`${ym}-01`,end:`${ym}-${String(last).padStart(2,"0")}`};}
function yearRange(y){return{start:`${y}-01-01`,end:`${y}-12-31`};}
function weekOfYear(dateStr){const d=new Date(dateStr);const start=new Date(d.getFullYear(),0,1);return Math.ceil(((d-start)/86400000+start.getDay()+1)/7);}
function weeksInYear(y){const allWeeks=[];let d=new Date(y,0,1);while(d.getFullYear()===y){const w=weekOfYear(d.toISOString().slice(0,10));if(!allWeeks.find(x=>x.w===w)){const monday=new Date(d);const sunday=new Date(d);sunday.setDate(sunday.getDate()+(6-sunday.getDay()));if(sunday.getFullYear()>y)sunday.setFullYear(y,11,31);allWeeks.push({w,label:`W${String(w).padStart(2,"0")}`,start:monday.toISOString().slice(0,10),end:sunday.toISOString().slice(0,10)});}d.setDate(d.getDate()+1);}return allWeeks;}
function aggregate(dom,start,end){const ent=MOVS.filter(m=>m.tipo==="entrada"&&m.dom===dom&&m.data>=start&&m.data<=end);const sai=MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom&&m.data>=start&&m.data<=end);return{ent,sai,qtdEnt:ent.reduce((s,e)=>s+e.qtd,0),qtdSai:sai.reduce((s,e)=>s+e.qtd,0),valEnt:ent.reduce((s,e)=>s+e.qtd*(e.custoUnit||0),0)};}

/* Linha completa por item no per\u00edodo: saldo inicial, entradas, sa\u00eddas, saldo final */
function itemPeriodo(pid,start,end){const ini=saldoAntes(pid,start);const{ent,sai}=movPeriodo(pid,start,end);return{ini:ini,ent:ent,sai:sai,fim:ini+ent-sai};}

async function loadAll(){
  carregarMin();
  driveSetStatus("syncing");
  const r = await api("getAll", null, true);
  if(!r.ok){
    driveSetStatus("error");
    toast("Erro ao carregar dados: "+(r.error||"verifique a conex\u00e3o"),"erro");
    return false;
  }
  PRODUTOS      = r.produtos      || [];
  MOVS          = r.movs          || [];
  DESLIGADOS    = r.desligados    || [];
  aplicarExclusoesLocaisDesl();
  // Backend \u00e9 a fonte da verdade \u2014 limpa cache antes de mergear (evita dados obsoletos no login)
  _colabCacheSet({});
  COLABORADORES = colabCacheMerge(r.colaboradores || []);
  driveSetStatus("ok");
  _lastLoadTs=Date.now();
  _updateSyncLbl();
  return true;
}

var _lastLoadTs=0;
var _refreshInterval=null;
async function refreshAll(){
  if(refreshAll._running) return; // prevent overlap
  refreshAll._running=true;
  var icon=document.getElementById("refresh_icon");
  var lbl=document.getElementById("refresh_lbl");
  if(icon) icon.style.transition="transform .4s";
  if(icon) icon.style.transform="rotate(360deg)";
  if(lbl) lbl.textContent="Atualizando\u2026";
  try{
    const r=await api("getAll",null,true);
    if(r&&r.ok){
      PRODUTOS      = r.produtos      || [];
      MOVS          = r.movs          || [];
      DESLIGADOS    = r.desligados    || [];
      aplicarExclusoesLocaisDesl();
      // Limpa cache de colaboradores antes de mergear para evitar dados obsoletos de outros dispositivos
      _colabCacheSet({});
      COLABORADORES = colabCacheMerge(r.colaboradores||[]);
      _lastLoadTs=Date.now();
      _updateSyncLbl();
      driveSetStatus("ok");
      render();
    } else {
      driveSetStatus("error");
    }
  } catch(e){
    driveSetStatus("error");
  } finally {
    refreshAll._running=false;
    setTimeout(function(){
      if(icon){icon.style.transform="rotate(0deg)";}
      if(lbl) lbl.textContent="Atualizar";
    },600);
  }
}
function _updateSyncLbl(){
  var el=document.getElementById("last_sync_lbl");
  if(!el||!_lastLoadTs) return;
  var diff=Math.round((Date.now()-_lastLoadTs)/1000);
  var txt=diff<60?"agora":diff<3600?Math.round(diff/60)+"min atr\u00e1s":Math.round(diff/3600)+"h atr\u00e1s";
  el.textContent="sync "+txt;
}
function _startAutoRefresh(){
  if(_refreshInterval) clearInterval(_refreshInterval);
  // Auto-refresh every 2 minutes
  _refreshInterval=setInterval(function(){
    if(getToken()) refreshAll();
  },2*60*1000);
  // Update "last sync" label every 30s
  setInterval(function(){_updateSyncLbl();},30000);
  // Refresh on tab/window focus if data is >60s old
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&getToken()){
      if(!_lastLoadTs||Date.now()-_lastLoadTs>60000) refreshAll();
    }
  });
  window.addEventListener("focus",function(){
    if(getToken()&&(!_lastLoadTs||Date.now()-_lastLoadTs>60000)) refreshAll();
  });
}
async function doLogin(){
  var email=(document.getElementById("li_email")||{}).value||"";
  var senha=(document.getElementById("li_senha")||{}).value||"";
  var err=document.getElementById("li_err");
  var btn=document.getElementById("li_btn");

  if(btn){btn.disabled=true;btn.textContent="Entrando\u2026";}
  if(err)err.textContent="";

  // URL configurada

  const r=await api("login",{email,senha},true);
  if(btn){btn.disabled=false;btn.textContent="Entrar";}
  if(!r.ok){if(err)err.textContent=r.error||"Erro ao fazer login.";return;}
  setSession(r.token,r.user);
  var ls=document.getElementById("login-screen");
  if(ls)ls.style.display="none";
  var appEl=document.getElementById("app");
  if(appEl)appEl.style.display="";
  // Atualizar header com usu\u00e1rio logado
  var saveEl=document.getElementById("save");
  if(saveEl)saveEl.textContent=r.user.nome||r.user.email;
  document.getElementById("main").innerHTML='<div class="loading">Carregando dados\u2026</div>';
  const loadOk = await loadAll();
  await loadPins();
  state.view="estoque";
  state.sel=null;
  state.colab=null;
  state.rep="semana";
  state.repYear=Number(today().slice(0,4));
  state.repWeek=weekOfYear(today());
  state.repMonth=today().slice(0,7);
  state.repStart=today().slice(0,8)+"01";
  state.repEnd=today();
  if(window._postLoginHook) window._postLoginHook();

  render();

  if(r.primeiroAcesso){
    setTimeout(function(){showPrimeiroAcesso();},600);
  }
}

function _uHistoricoFiltrar(){
  var r=window._histData;
  var el=document.getElementById("hist-list");if(!el)return;
  if(!r){el.innerHTML='<div class="loading">Carregando\u2026</div>';return;}
  if(!r.ok){el.innerHTML='<div class="empty">Erro: '+esc(r.error)+'</div>';return;}
  if(!r.data||!r.data.length){el.innerHTML='<div class="empty">Nenhum registro.</div>';return;}
  var mesSel=(document.getElementById("hist_mes")||{}).value||"";
  var acaoLabel={
    'login':'\ud83d\udd11 Login',
    'trocaSenha':'\ud83d\udd12 Troca de Senha',
    'resetSenha':'\u21ba Reset de Senha',
    'saveUsuario':'\ud83d\udc64 Usu\u00e1rio Salvo',
    'deleteUsuario':'\ud83d\uddd1 Usu\u00e1rio Exclu\u00eddo',
    'saveMovimentacao':'\ud83d\udce6 Movimenta\u00e7\u00e3o',
    'deleteMovimentacao':'\u2702 Exclus\u00e3o de Movimenta\u00e7\u00e3o',
    'saveProduto':'\u2795 Produto Salvo',
    'deleteProduto':'\ud83d\uddd1 Produto Exclu\u00eddo',
    'saveColaborador':'\ud83d\udc77 Colaborador Salvo',
    'saveDesligado':'\u26a0 Colaborador Desligado',
    'saveRecibo':'\ud83d\udccb Recibo Salvo',
    'getAll':'\ud83d\udcc2 Acesso ao Sistema'
  };
  // Filtrar pelo m\u00eas selecionado
  // O Apps Script grava o timestamp no formato "DD/MM/YYYY, HH:MM:SS"
  // O seletor retorna "YYYY-MM"
  function tsMesAno(ts){
    // Tenta formato "DD/MM/YYYY, HH:MM:SS" \u2192 extrai "YYYY-MM"
    var m1=ts.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if(m1) return m1[3]+"-"+m1[2]; // YYYY-MM
    // Fallback: tenta formato ISO "YYYY-MM-DD..." ou "YYYY-MM..."
    var m2=ts.match(/^(\d{4})[-/](\d{2})/);
    if(m2) return m2[1]+"-"+m2[2];
    return "";
  }
  var filtrado=mesSel
    ?r.data.filter(function(h){
        return tsMesAno(h.ts||"")===mesSel;
      })
    :r.data;
  var total=filtrado.length;
  var rows=filtrado.map(function(h){
    var lbl=acaoLabel[h.acao]||h.acao||'\u2014';
    var chipCol=h.acao==='login'?'sai':h.acao.includes('delete')||h.acao.includes('Exclu')?'desl':'tam';
    return '<tr>'
      +'<td style="font-size:11px;font-family:var(--mono);white-space:nowrap;color:var(--txt-dim)">'+esc(h.ts)+'</td>'
      +'<td><b>'+esc(h.nome||h.email)+'</b><br><span style="font-size:10px;color:var(--txt-faint)">'+esc(h.email)+'</span></td>'
      +'<td><span class="chip '+chipCol+'">'+lbl+'</span></td>'
      +'<td style="font-size:12px;color:var(--txt-dim)">'+esc(h.detalhes||"")+'</td></tr>';
  }).join("")||'<tr><td colspan="4"><div class="empty">Nenhum registro neste m\u00eas.</div></td></tr>';
  el.innerHTML='<div style="font-size:11.5px;color:var(--txt-faint);margin-bottom:8px">'+total+' registro'+(total===1?'':'s')+' no m\u00eas</div>'
    +'<div style="max-height:400px;overflow:auto"><table style="font-size:12.5px">'
    +'<thead><tr><th>Data/Hora</th><th>Usu\u00e1rio</th><th>A\u00e7\u00e3o</th><th>Detalhes</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

function render(){
  try{
    // Restri\u00e7\u00e3o operador \u2014 for\u00e7ar view colaboradores
    const _u=getUser();
    if(_u&&_u.nivel==="operador"&&state.view!=="colaboradores"){state.view="colaboradores";}
    document.querySelectorAll(".dom-tab").forEach(b=>b.classList.toggle("active",b.dataset.dom===state.dom));
    const isInsumos=state.dom==="insumos";
    const menuColab=document.getElementById("menuColab");
    const menuDesl=document.getElementById("menuDesl");
    if(menuColab)menuColab.style.display=isInsumos?"none":"";
    if(menuDesl)menuDesl.style.display=isInsumos?"none":"";
    const menuUsuarios=document.getElementById("menuUsuarios");
    if(menuUsuarios)menuUsuarios.style.display=isAdmin()?"":"none";
    if(isInsumos&&(state.view==="colaboradores"||state.view==="desligados"))state.view="estoque";
    document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
    const m=document.getElementById("main");
    if(!m)return;
    let html="";
    try{
      if(state.view==="estoque")            html=viewEstoque();
      else if(state.view==="colaboradores") html=state.colab?viewColabDet():viewColabList();
      else if(state.view==="desligados")    html=viewDesligados();
      else if(state.view==="relatorios")    html=viewRel();
      else if(state.view==="busca")          html=viewBusca();
      else if(state.view==="verificar")      html=viewVerificar();
      else if(state.view==="usuarios")      { viewUsuariosPanel(); return; }
    }catch(viewErr){
      html='<div style="padding:30px;color:var(--red);font-family:var(--mono);font-size:13px">'
          +'<b>Erro ao renderizar:</b> '+viewErr.message
          +'<br><br><button class="btn ghost sm" onclick="render()">Tentar novamente</button></div>';
      console.error("viewErr:",viewErr);
    }
    m.innerHTML=html||'<div class="empty">Sem conte\u00fado.</div>';
    wire();
  }catch(e){
    console.error("render erro:",e);
  }
}

/* ================= ESTOQUE ================= */
function viewEstoque(){
  const dom=state.dom;
  if(!dom){return '<div class="empty">Dom\u00ednio n\u00e3o definido.</div>';}
  const prods=(prodOf(dom)||[]).slice().sort((a,b)=>a.descricao.localeCompare(b.descricao,"pt-BR"));
  const sel=selProd();
  const showSaida=dom==="insumos";
  // Mostrar apenas descri\u00e7\u00e3o
  const prodOpts=prods.length
    ?`<option value="">\u2014 Todos os itens \u2014</option>`+prods.map(p=>`<option value="${p.id}" ${state.sel===p.id?"selected":""}>${esc(p.descricao)}</option>`).join("")
    :`<option value="">Nenhum produto cadastrado</option>`;
  const hasSel=!!sel;

  let detRows,totals;
  if(sel){
    const ms=movOf(sel.id).slice().sort((a,b)=>b.data>a.data?1:(b.data<a.data?-1:((b._t||0)-(a._t||0))));
    // Card-style movement list
    detRows=ms.length?ms.map(mv=>{
      const isEnt=mv.tipo==="entrada";
      const accent=isEnt?"#27b863":"#e84040";
      const bgRow=isEnt?"#f7fdf9":"#fdf5f5";
      const qtdClr=isEnt?"var(--green)":"var(--red)";
      const sign=isEnt?"+":"\u2212";
      const badgeBg=isEnt?"#e6f7ee":"#fde8e8";
      const badgeTxt=isEnt?"#1a7a44":"#c0392b";
      const badgeLbl=isEnt?"ENTRADA":"SA\u00cdDA";
      const tamTag=mv.tamanho?`<span class="chip tam" style="font-size:10.5px">${esc(mv.tamanho)}</span>`:"";
      const corTag=mv.cor?`<span class="chip" style="font-size:10.5px;background:#f0f2f5;padding:2px 7px">${corDot(mv.cor)}${esc(mv.cor)}</span>`:"";
      const obsTag=mv.obs?`<span style="font-size:11px;color:var(--txt-faint);font-style:italic">${esc(mv.obs)}</span>`:"";
      const libTag=!isEnt&&mv.liberadoPor?`<span style="font-size:11px;color:var(--txt-faint)">\u25b8 lib: <b>${esc(mv.liberadoPor)}</b></span>`:"";
      const custoTag=mv.custoUnit?`<span style="font-size:11px;color:var(--txt-dim);font-family:var(--mono)">${brl(mv.custoUnit)}/un</span>`:"";
      return `<div style="display:flex;align-items:stretch;border-bottom:1px solid var(--line-soft)">
        <div style="width:4px;flex:0 0 4px;background:${accent}"></div>
        <div style="display:flex;flex:1;align-items:center;gap:14px;padding:9px 14px;background:${bgRow};min-width:0">
          <div style="display:flex;flex-direction:column;align-items:center;min-width:50px;flex:0 0 50px">
            <span style="font-size:10.5px;font-weight:700;color:var(--txt-dim);white-space:nowrap">${fmtD(mv.data)}</span>
            <span style="font-size:16px;margin-top:2px">${isEnt?"\ud83d\udce6":"\ud83d\udce4"}</span>
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-size:13.5px;font-weight:700;color:var(--txt)">${esc(mv.parte||"\u2014")}</span>
              <span style="padding:2px 8px;border-radius:12px;font-size:9.5px;font-weight:800;letter-spacing:.05em;background:${badgeBg};color:${badgeTxt}">${badgeLbl}</span>
              ${tamTag}${corTag}
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${libTag}${custoTag}${obsTag}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto">
            <span style="font-family:var(--mono);font-weight:800;font-size:22px;color:${qtdClr};line-height:1">${sign}${mv.qtd}</span>
            <div style="display:flex;gap:4px">
              ${isEnt?`<button class="icon-btn" data-editmov="${mv.id}" title="Editar" style="color:var(--blue)">\u270e</button>`:""}
              <button class="icon-btn del" data-delmov="${mv.id}" title="Excluir">\ud83d\uddd1</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join(""):`<div class="empty" style="padding:24px">Sem movimenta\u00e7\u00f5es. Use <b>Entrada (F5)</b>.</div>`;
    const at=atual(sel.id),cu=custoUnit(sel.id);
    totals=`<div class="totals">
      <div class="tot"><span class="l">Produto</span><span class="v">${esc(sel.descricao)}</span></div>
      <div class="tot"><span class="l">Quantidade Total</span><span class="v ${at<=0?'red':''}">${at}</span></div>
      <div class="tot"><span class="l">Dispon\u00edvel</span><span class="v green">${at}</span></div>
      <div class="tot"><span class="l">Custo Total do Estoque</span><span class="v blue">${brl(custoTotalEntradas(sel.id))}</span></div>
      <div class="tot"><span class="l">Custo Atual da Unidade</span><span class="v">${brl(cu)}</span></div></div>`;
  }else{
    // Mostrar todos itens com saldo
    const todosProd=prods.map(p=>({p,saldo:atual(p.id)}));
    const resumoRows=todosProd.map(({p,saldo})=>{
      const cu=custoUnit(p.id);
      // Se produto tem tamanhos, mostra linha-mestre com saldo total + details clic\u00e1vel
      if(p.tamanhos&&p.tamanhos.length>0){
        const hasCores=(p.cores&&p.cores.length>0);
        const tamDetail=hasCores?
          (function(){
            var thCells=p.tamanhos.map(function(t){return '<th style="text-align:center;padding:4px 12px;font-size:11px;font-weight:700;color:var(--txt-dim);letter-spacing:.04em;border-bottom:1px solid var(--line)">'+esc(t)+'</th>';}).join('');
            var bodyRows=p.cores.map(function(cr){
              var tds=p.tamanhos.map(function(t){var s=saldoVar(p.id,t,cr);var cl=s<=0?'var(--red)':'var(--green)';return '<td style="text-align:center;font-family:var(--mono);font-weight:700;font-size:14px;color:'+cl+';padding:5px 12px">'+s+'</td>';}).join('');
              return '<tr style="border-bottom:1px solid var(--line-soft)"><td style="font-size:12.5px;font-weight:600;padding:5px 18px 5px 0;white-space:nowrap;color:var(--txt);min-width:110px">'+esc(cr)+'</td>'+tds+'</tr>';
            }).join('');
            var totTds=p.tamanhos.map(function(t){var s=p.cores.reduce(function(acc,cr){return acc+saldoVar(p.id,t,cr);},0);var cl=s<=0?'var(--red)':'var(--green)';return '<td style="text-align:center;font-family:var(--mono);font-weight:800;font-size:14px;color:'+cl+';padding:5px 12px;border-top:2px solid var(--line)">'+s+'</td>';}).join('');
            return '<table style="border-collapse:collapse;width:100%"><thead><tr><th style="text-align:left;padding:4px 18px 4px 0;font-size:10px;color:var(--txt-faint);font-weight:600;border-bottom:1px solid var(--line)">Tipo / Cor</th>'+thCells+'</tr></thead><tbody>'+bodyRows+'<tr><td style="font-size:11px;font-weight:600;color:var(--txt-faint);padding:5px 18px 5px 0;border-top:2px solid var(--line)">Total</td>'+totTds+'</tr></tbody></table>';
          })():
          p.tamanhos.map(function(t){
            var sT=saldoVar(p.id,t,"");
            var cor=sT<=0?'var(--red)':'var(--green)';
            return '<div style="display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:52px;gap:2px"><span style="font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--txt-dim)">'+esc(t)+'</span><span style="font-family:var(--mono);font-weight:800;font-size:16px;color:'+cor+'">'+sT+'</span></div>';
          }).join("");
        return `<tr>
          <td colspan="5" style="padding:0">
            <details style="width:100%">
              <summary style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line-soft);user-select:none">
                <span class="det-arrow" style="font-size:11px;color:var(--txt-faint);transition:transform .2s;flex:0 0 12px">\u25b6</span>
                <b style="flex:1;font-size:13.5px">${esc(p.descricao)}</b>
                <span style="font-size:11px;color:var(--txt-faint);margin-right:12px">${esc(p.setor||"")}</span>
                <span style="font-family:var(--mono);font-weight:700;font-size:14px;min-width:44px;text-align:right;color:${saldo<=0?'var(--red)':'var(--green)'}">${saldo}</span>
                <span style="min-width:90px;text-align:right;font-size:12px;color:var(--txt-faint)">${brl(cu)}</span>
                <span style="min-width:90px;text-align:right;font-size:12px;color:var(--txt-faint)">${brl(saldo*cu)}</span>
              </summary>
              <div style="padding:12px 14px 14px 36px;background:#f6f8fb;border-bottom:1px solid var(--line-soft)">
                <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);font-weight:600;margin-bottom:10px">Saldo por tamanho</div>
                ${hasCores?'<div style="overflow-x:auto">':'<div style="display:flex;flex-wrap:wrap;gap:8px">'}${tamDetail}</div>
              </div>
            </details>
          </td>
        </tr>`;
      }
      return `<tr>
        <td><b>${esc(p.descricao)}</b></td>
        <td>${esc(p.setor||"")}</td>
        <td class="num ${saldo<=0?'qneg':'qpos'}">${saldo}</td>
        <td class="num">${brl(cu)}</td>
        <td class="num">${brl(saldo*cu)}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="5"><div class="empty">Nenhum produto cadastrado.</div></td></tr>`;
    detRows=resumoRows;
    // Totais gerais removidos da view de estoque (solicitado pelo usu\u00e1rio)
    totals="";
  }

  const tableHeader=sel
    ? "" // card view \u2014 no table header needed
    :`<thead><tr><th>Produto</th><th>Tipo/Modelo</th><th class="num">Saldo</th><th class="num">Custo Unit.</th><th class="num">Valor Total</th></tr></thead>`;

  // Toolbar de produto: s\u00f3 no contexto do produto selecionado (lista suspensa de Safety/Insumos)
  const prodToolbar=`
  <div class="toolbar">
    <button class="tbtn" data-act="novoProd"><span class="ic">\u2795</span> Cadastrar Produto</button>
    <button class="tbtn" data-act="editProd" ${hasSel?"":"disabled"}><span class="ic">\u270e</span> Alterar Produto</button>
    <button class="tbtn tb-red" data-act="delProd" ${hasSel?"":"disabled"}><span class="ic">\u2716</span> Excluir Produto</button>
    <span class="tb-sep"></span>
    <button class="tbtn" onclick="backupManual()" title="Backup agora no Google Drive"><span class="ic">&#9729;</span> Backup Drive</button>
    <a href="https://drive.google.com/drive/folders/${DRIVE_FOLDER_EPI}" target="_blank" class="tbtn" style="text-decoration:none" title="Abrir a pasta dos comprovantes no Drive"><span class="ic">&#128194;</span> Pasta Comprovantes</a>
    <a href="https://docs.google.com/spreadsheets/d/1do1YfKP4cRtyFOYA3lkFqYvaY4NStDlkFGtNbUYVZ-w/edit" target="_blank" class="tbtn" style="text-decoration:none" title="Abrir a base de dados (planilha)"><span class="ic">&#128202;</span> Base de Dados</a>
  </div>`;

  return `
  ${prodToolbar}
  <div class="selbar">
    <div class="fg grow"><label>Produto \u00b7 ${dom==="safety"?"Safety":"Insumos"}</label>
      <select id="prodSel">${prodOpts}</select></div>
  </div>
  <div class="toolbar">
    <button class="tbtn tb-green" data-act="entrada" ${hasSel?"":"disabled"}><span class="ic">\u2193</span> Entrada no Estoque <span class="k">F5</span></button>
    ${showSaida?`<button class="tbtn" data-act="saida" ${hasSel?"":"disabled"}><span class="ic">\u2191</span> Sa\u00edda do Estoque <span class="k">F6</span></button>`:`<span style="font-size:12px;color:var(--txt-faint)">As entregas de EPI s\u00e3o feitas na aba <b style="color:var(--blue)">Colaboradores</b>.</span>`}
    <span class="tb-sep"></span>
    <button class="tbtn" data-act="ajusteEstoque" ${hasSel?"":"disabled"} title="Corrige o saldo diretamente, sem lan\u00e7ar uma entrada/sa\u00edda manual"><span class="ic">&#9881;</span> Ajustar Estoque</button>
  </div>
  <div class="panel detail">
    <div class="panel-bar"><h3>${sel?"Movimenta\u00e7\u00f5es":"Resumo de Estoque"}</h3>${hasSel?`<div class="right"><span style="font-size:12px;color:var(--txt-faint)">${esc(sel.descricao)}</span></div>`:""}</div>
    <div class="scroll-y">${sel?detRows:`<table>${tableHeader}<tbody>${detRows}</tbody></table>`}</div>
  </div>
  ${totals}`;
}

/* ================= COLABORADORES ================= */
function viewColabList(){
  const dom=state.dom;
  const btn=dom==="safety"?`<button class="btn primary sm" data-act="novaEntrega">\uff0b Nova Entrega de EPI</button>`:"";
  const btnCad=dom==="safety"?'<button class="btn ghost sm" onclick="formCadastroColab()">\uff0b Cadastrar Colaborador</button>':"";
  const btnRelColab=dom==="safety"?'<button class="btn ghost sm" onclick="abrirRelatorioColaboradores()">&#128203; Relat\u00f3rio de Colaboradores</button>':"";
  const unidadeSel=dom==="safety"?(state.colabUnidade||"SMG6"):"";
  const turnoSel=dom==="safety"&&unidadeSel==="SMG6"?(state.colabTurno||""):"";;
  const ativos=colabListaAtivos(dom,unidadeSel||undefined,turnoSel||undefined);

  const unidadeTabs=dom==="safety"?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);font-weight:600">Unidade:</span>
    <div class="seg" id="colabUnidSeg">
      <button data-cu="SMG6" class="${unidadeSel==="SMG6"?"active":""}">SMG6</button>
      <button data-cu="XMG2" class="${unidadeSel==="XMG2"?"active":""}">XMG2</button>
    </div>
    ${unidadeSel==="SMG6"?`<div class="seg" id="colabTurnoSeg" style="margin-left:12px">
      <button data-ct="" class="${turnoSel===""?"active":""}">Todos</button>
      <button data-ct="AM" class="${turnoSel==="AM"?"active":""}">AM</button>
      <button data-ct="PM" class="${turnoSel==="PM"?"active":""}">PM</button>
    </div>`:""}
  </div>`:"";

  // Stats movimenta\u00e7\u00f5es por colaborador
  const statsMap={};
  MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom).forEach(function(m){
    if(!m.parte)return;
    var _sk=(m.parte).toLowerCase(); // chave case-insensitive
    if(!statsMap[_sk])statsMap[_sk]={itens:0,reg:0,ultima:null,_nome:m.parte};
    statsMap[_sk].itens+=m.qtd;statsMap[_sk].reg++;
    if(!statsMap[_sk].ultima||m.data>statsMap[_sk].ultima)statsMap[_sk].ultima=m.data;
  });

  const colabSel=state.colab||"";
  const busca=(state.colabBusca||"").trim().toLowerCase();
  const filtrados=busca?ativos.filter(n=>n.toLowerCase().includes(busca)):ativos;
  const selectHtml=`<div class="colab-select-wrap">
    ${unidadeTabs}
    <label style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);font-weight:600">Buscar colaborador</label>
    <input id="colabBusca" type="text" placeholder="Digite o nome\u2026" value="${esc(state.colabBusca||"")}" autocomplete="off"
      style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:8px;box-sizing:border-box">
    <select id="colabDropdown" size="${busca&&filtrados.length>1?Math.min(filtrados.length+1,8):1}">
      <option value="">${busca?(filtrados.length+" resultado"+(filtrados.length===1?"":"s")):"\u2014 Selecione um colaborador \u2014"}</option>
      ${filtrados.map(n=>`<option value="${esc(n)}" ${colabSel===n?"selected":""}>${esc(n)}</option>`).join("")}
    </select>
    ${busca&&filtrados.length===0?'<div style="font-size:12px;color:var(--red);margin-top:6px">Nenhum colaborador encontrado para "'+esc(state.colabBusca)+'".</div>':""}
  </div>`;

  if(colabSel && ativos.includes(colabSel)){
    const stats=statsMap[(colabSel||"").toLowerCase()]||{itens:0,reg:0,ultima:null};
    const _colabSelLc=(colabSel||"").toLowerCase();const reg=MOVS.filter(m=>m.tipo==="saida"&&m.dom===dom&&(m.parte||"").toLowerCase()===_colabSelLc).sort((a,b)=>b.data>a.data?1:-1);
    const total=reg.reduce((s,r)=>s+r.qtd,0);
    const porProd={};
    reg.forEach(r=>{const p=PRODUTOS.find(x=>x.id===r.produtoId);const n=p?p.descricao:r.produtoId;porProd[n]=(porProd[n]||0)+r.qtd;});
    const rows=reg.map(r=>{
      const p=PRODUTOS.find(x=>x.id===r.produtoId);
      const ant=reg.filter(x=>x.produtoId===r.produtoId&&x.data<r.data).sort((a,b)=>b.data>a.data?1:-1)[0];
      const d=ant?days(ant.data,r.data):null;
      const flag=(d!==null&&d<ALERTA_DIAS)?`<span class="chip warn" title="Intervalo de ${d} dias">\u26a0 ${d}d</span>`:"";
      var reciboBtn=(r.temRecibo||r.reciboRef)?'<button class="icon-btn" title="Ver Comprovante de Entrega" onclick="reemitirRecibo(\''+(r.reciboRef||r.id)+'\')">&#128196;</button>':'';
      return '<tr><td class="num">'+fmtD(r.data)+'</td><td><b>'+esc(p?p.descricao:"?")+'</b></td>'
        +'<td>'+(r.tamanho?'<span class="chip tam">'+esc(r.tamanho)+'</span>':(r.cor?corDot(r.cor)+esc(r.cor):"\u2014"))+'</td>'
        +'<td class="num">'+r.qtd+'</td><td>'+esc(r.liberadoPor||"")+' '+flag+'</td>'
        +'<td class="num" style="display:flex;gap:4px;justify-content:flex-end">'+reciboBtn+'<button class="icon-btn del" title="Excluir" data-delmov="'+r.id+'">&#128465;</button></td></tr>';
    }).join("");
    const chips=Object.entries(porProd).sort((a,b)=>b[1]-a[1]).map(([p,q])=>`<span class="chip tam" style="margin:3px">${esc(p)}: <b>${q}</b></span>`).join("");
    const btnDesl=(dom==="safety"&&isAdmin()&&!isExpurgo(colabSel))?`<button class="btn danger sm" onclick="desligarColab('${esc(colabSel)}')">\u26a0 Desligar Colaborador</button>`:"";
    return `<div class="panel">
      <div class="panel-bar"><h3>Colaboradores \u00b7 ${dom==="safety"?"Safety":"Insumos"}</h3><div class="right" style="gap:8px">${btnRelColab}${btnCad}${btn}</div></div>
      ${selectHtml}
      <div class="colab-det">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-family:var(--disp);font-weight:800;font-size:20px">${esc(colabSel)}</div>
            <div style="font-size:12px;color:var(--txt-dim);margin-top:3px"><b>${reg.length}</b> ${dom==="safety"?"entregas":"retiradas"} \u00b7 <b>${total}</b> itens \u00b7 \u00faltima: <b>${fmtD(stats.ultima)}</b></div>
          </div>
          <button class="btn ghost sm" onclick="formCadastroColab(COLABORADORES.find(function(x){return x.nome==='${esc(colabSel)}';}))">\u270e Editar Cadastro</button>
          ${btnDesl}
        </div>
        <div style="margin-top:10px">${chips||`<span style="color:var(--txt-faint)">Sem registros</span>`}</div>
      </div>
      <div class="scroll-y" style="max-height:380px"><table>
        <thead><tr><th>Data</th><th>Produto</th><th>Tam./Cor</th><th class="num">Qtd</th><th>Liberado por</th><th></th></tr></thead>
        <tbody>${rows||`<tr><td colspan="6"><div class="empty">Sem registros.</div></td></tr>`}</tbody>
      </table></div>
    </div>`;
  }

  // Sem colaborador selecionado
  return `<div class="panel">

/* ================= DESLIGADOS ================= */
/* Codigo de validacao e botao de comprovante (usado no historico de Desligados) */
function _codMov(r){
  var c=r.codigo||"";
  if(!c&&r.obs){var mm=/\[COD:\s*([A-Z0-9\-]+)\]/i.exec(r.obs);if(mm)c=mm[1];}
  return c;
}
function _btnReciboDesl(r){
  var id=r.reciboRef||r.id;
  var mv=MOVS.find(function(x){return x.id===id;})||r;
  if(mv.temRecibo||mv.reciboUrl||r.temRecibo||r.reciboRef)
    return '<button class="icon-btn" title="Ver Comprovante de Entrega" onclick="reemitirRecibo(\''+id+'\')">&#128196;</button>';
  return '<button class="icon-btn" title="Gerar comprovante" onclick="reemitirRecibo(\''+id+'\')">&#128196;</button>';
}
function viewDesligados(){
  var _deslExcl=deslExclGet();
  const todos=[...new Set([...COLAB_PLANILHA_DESLIGADOS,...DESLIGADOS])]
    .filter(function(n){return !_deslExcl.some(function(e){return e.toLowerCase()===n.toLowerCase();});})
    .sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const histSel=state.histColab||"";

  if(histSel && todos.includes(histSel)){
    const _histSelLc=(histSel||"").toLowerCase();const reg=MOVS.filter(m=>m.tipo==="saida"&&(m.parte||"").toLowerCase()===_histSelLc).sort((a,b)=>b.data>a.data?1:-1);
    const total=reg.reduce((s,r)=>s+r.qtd,0);
    const porProd={};
    reg.forEach(r=>{const p=PRODUTOS.find(x=>x.id===r.produtoId);const n=p?p.descricao:r.produtoId;porProd[n]=(porProd[n]||0)+r.qtd;});
    const chips=Object.entries(porProd).sort((a,b)=>b[1]-a[1]).map(([p,q])=>`<span class="chip tam" style="margin:3px">${esc(p)}: <b>${q}</b></span>`).join("");
    const rows=reg.map(r=>{
      const p=PRODUTOS.find(x=>x.id===r.produtoId);
      return `<tr><td class="num">${fmtD(r.data)}</td><td><b>${esc(p?p.descricao:"?")}</b></td>
        <td>${r.tamanho?`<span class="chip tam">${esc(r.tamanho)}</span>`:r.cor?corDot(r.cor)+esc(r.cor):"\u2014"}</td>
        <td class="num">${r.qtd}</td><td>${esc(r.liberadoPor||"")}</td><td style="font-family:var(--mono)">${esc(_codMov(r)||"\u2014")}</td><td class="num">${_btnReciboDesl(r)}</td></tr>`;
    }).join("");
    return `<div class="panel">
      <div class="panel-bar">
        <button class="btn ghost sm" onclick="state.histColab=null;render()">\u2190 Voltar</button>
        <h3 style="margin-left:8px">Hist\u00f3rico \u00b7 ${esc(histSel)}</h3>
        <div class="right"><span class="chip desl">Desligado</span></div></div>
      <div class="colab-det">
        <div style="font-family:var(--disp);font-weight:800;font-size:20px">${esc(histSel)}</div>
        <div style="font-size:12px;color:var(--txt-dim);margin-top:3px"><b>${reg.length}</b> entregas \u00b7 <b>${total}</b> itens</div>
        <div style="margin-top:10px">${chips||`<span style="color:var(--txt-faint)">Sem registros</span>`}</div>
      </div>
      <div class="scroll-y" style="max-height:420px"><table>
        <thead><tr><th>Data</th><th>Produto</th><th>Tam./Cor</th><th class="num">Qtd</th><th>Liberado por</th><th>C\u00f3digo</th><th class="num">Comprovante</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="7"><div class="empty">Nenhuma entrega registrada.</div></td></tr>`}</tbody>
      </table></div>
    </div>`;
  }

  const rows=todos.map(n=>`<tr>
    <td><b>${esc(n)}</b></td>
    <td><span class="chip desl">Desligado</span></td>
    <td class="num">${MOVS.filter(function(m){return m.tipo==="saida"&&(m.parte||"").toLowerCase()===(n||"").toLowerCase();}).length}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn ghost sm" onclick="state.histColab='${esc(n)}';render()">\ud83d\udccb Hist\u00f3rico</button>
      <button class="btn danger sm" onclick="excluirDesligado('${esc(n)}')">\ud83d\uddd1 Excluir</button>
    </td>
  </tr>`).join("") || `<tr><td colspan="4"><div class="empty">Nenhum desligado registrado.</div></td></tr>`;
  return `<div class="panel">
    <div class="panel-bar"><h3>Colaboradores Desligados</h3></div>
    <div class="scroll-y"><table>
      <thead><tr><th>Nome</th><th>Status</th><th class="num">Registros</th><th>A\u00e7\u00e3o</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

    +'<option value="PM" '+((c.turno==="PM")?"selected":"")+'>PM</option>'
    +'</select></div>'
    +'<div class="mfield"><label>G\u00eanero <span class="req">*</span></label>'
    +'<select id="cc_genero">'
    +'<option value="Masc." '+((c.genero==="Masc."||!c.genero)?"selected":"")+'>Masculino</option>'
    +'<option value="Fem." '+((c.genero==="Fem.")?"selected":"")+'>Feminino</option>'
    +'</select></div>'
    +'</div>'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-dim);margin:14px 0 8px">Tamanhos de Uniforme</div>'

    +'<div class="mfield"><label>Bermuda</label><select id="cc_bermuda"><option value="">\u2014</option><option>36</option><option>38</option><option>40</option><option>42</option><option>44</option><option>46</option><option>48</option><option>50</option><option>52</option></select></div>'

    +'</div>';
  function preSelect(id,val){setTimeout(function(){var el=document.getElementById(id);if(el&&val)el.value=val;},80);}
  openModal((isNew?"Cadastrar":"Editar")+" Colaborador",body,[
    {label:"Cancelar",cls:"ghost",act:closeModal},
    {label:"Salvar",cls:"primary",act:async function(){
      var nome=(document.getElementById("cc_nome")||{}).value||"";
      if(!nome.trim()){toast("Nome \u00e9 obrigat\u00f3rio","erro");return;}
      var cpfDig=((document.getElementById("cc_cpf")||{}).value||"").replace(/\D/g,'');
      if(cpfDig.length!==11){toast("Informe um CPF v\u00e1lido (11 d\u00edgitos) \u2014 \u00e9 usado para conferir a identidade na entrega de EPI","erro");return;}
      var _ccFuncao=((document.getElementById("cc_funcao")||{}).value||"").trim();
      var _ccAdm=((document.getElementById("cc_admissao")||{}).value||"").trim();
      if(!_ccFuncao){toast("Informe a Fun\u00e7\u00e3o / Cargo","erro");return;}
      if(!_ccAdm){toast("Informe a Data de Admiss\u00e3o","erro");return;}
      var _ccUnidade=(document.getElementById("cc_unidade")||{}).value||"SMG6";
      var obj={
        id:c.id||uid(),nome:nome.trim(),
        cpf:(document.getElementById("cc_cpf")||{}).value||"",
        contato:(document.getElementById("cc_contato")||{}).value||"",
        unidade:_ccUnidade,
        turno:_ccUnidade==="SMG6"?((document.getElementById("cc_turno")||{}).value||"AM"):"",

        tamCalca:(document.getElementById("cc_calca")||{}).value||"",
        tamBermuda:(document.getElementById("cc_bermuda")||{}).value||"",
        tamBota:(document.getElementById("cc_bota")||{}).value||"",
        tamBlusa:(document.getElementById("cc_blusa")||{}).value||"",
        tamColete:(document.getElementById("cc_colete")||{}).value||"",
        ativo:true
      };
      var _oldNome=(!isNew&&c.nome)?c.nome:"";

      if(!r.ok){toast("Erro: "+r.error,"erro");return;}
      if(isNew){COLABORADORES.push(obj);}
      else{
        // Remove vers\u00e3o antiga (por id OU nome antigo, para caso o backend tenha duplicado)
        COLABORADORES=COLABORADORES.filter(function(x){
          return x.id===obj.id||(x.nome.toLowerCase()!==(_oldNome||"").toLowerCase()&&x.id!==obj.id);
        });
        var idx=COLABORADORES.findIndex(function(x){return x.id===obj.id;});
        if(idx>=0){COLABORADORES[idx]=obj;}else{COLABORADORES.push(obj);}
        // Atualiza refer\u00eancias nos MOVS (case-insensitive)
        if(_oldNome&&_oldNome.toLowerCase()!==obj.nome.toLowerCase()){
          MOVS.forEach(function(m){if(m.parte&&m.parte.toLowerCase()===_oldNome.toLowerCase())m.parte=obj.nome;});
        }
      }
      colabCacheSave(obj);
      // Remove vers\u00e3o antiga do cache
      if(!isNew&&_oldNome){
        var _ch=_colabCacheGet();
        Object.keys(_ch).forEach(function(id){
          if(_ch[id].nome&&_ch[id].nome.toLowerCase()===_oldNome.toLowerCase()&&id!==obj.id){
            delete _ch[id];
          }
        });
        _colabCacheSet(_ch);
      }
      closeModal();
      toast(isNew?"Colaborador cadastrado!":"Colaborador atualizado.","ok");
      state.colab=obj.nome;render();
    }}
  ]);
  setTimeout(function(){
    var ci=document.getElementById("cc_cpf");
    if(ci)ci.addEventListener("input",function(){
      var v=ci.value.replace(/\D/g,'').slice(0,11);
      if(v.length>9)ci.value=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
      else if(v.length>6)ci.value=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
      else if(v.length>3)ci.value=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
      else ci.value=v;
      var warnEl=document.getElementById('cc_cpf_warn');
      if(warnEl){var digs=ci.value.replace(/\D/g,'');if(digs.length===11){var dupColab=COLABORADORES.find(function(x){return x.cpf&&x.cpf.replace(/\D/g,'')===digs&&x.id!==(c.id||'');});warnEl.textContent=dupColab?'\u26a0 CPF j\u00e1 cadastrado para: '+dupColab.nome:'';}else{warnEl.textContent=''}}
    });
  },80);
  if(!isNew){
    preSelect("cc_camisa",c.tamCamisa);preSelect("cc_calca",c.tamCalca);
    preSelect("cc_bermuda",c.tamBermuda);preSelect("cc_bota",c.tamBota);
    preSelect("cc_blusa",c.tamBlusa);preSelect("cc_colete",c.tamColete);
  }
}

async function desligarColab(nome){
  if(!isAdmin()){toast("Apenas administradores podem desligar colaboradores","erro");return;}
  if(isExpurgo(nome)){toast("O perfil Expurgo \u00e9 fixo do sistema e n\u00e3o pode ser desligado.","erro");return;}
  const ok=await confirmModal("Desligar Colaborador",`Mover <b>${esc(nome)}</b> para a lista de desligados? O hist\u00f3rico ser\u00e1 preservado.`,"Desligar");
  if(!ok)return;
  if(!DESLIGADOS.includes(nome)){DESLIGADOS.push(nome);}
  await persistDesl(nome);
  state.colab=null;
  toast(`${nome} movido para Desligados.`,"warn");render();
}

async function excluirDesligado(nome){
  const ok=await confirmModal(
    "Excluir Desligado",
    `Excluir permanentemente <b>${esc(nome)}</b> da lista de desligados?<br><small style="color:var(--txt-dim)">O hist\u00f3rico de movimenta\u00e7\u00f5es ser\u00e1 preservado.</small>`,
    "Excluir"
  );
  if(!ok)return;
  const r=await api("saveDesligado",{nome,acao:"excluir"});
  if(!r.ok){toast("Erro ao excluir: "+r.error,"erro");return;}
  DESLIGADOS=DESLIGADOS.filter(function(d){return d.toLowerCase()!==(nome||"").toLowerCase();});
  COLAB_PLANILHA_DESLIGADOS=(COLAB_PLANILHA_DESLIGADOS||[]).filter(function(d){return d.toLowerCase()!==(nome||"").toLowerCase();});
  deslExclAdd(nome); // persiste no localStorage para sobreviver ao reload
  toast(nome+" removido da lista de desligados.","ok");
  render();
}

/* Calcula start/end/label conforme state.rep (compartilhado por Relat\u00f3rios e Dashboard) */
function repRange(){
  const todayStr=today();
  if(!state.repYear)state.repYear=Number(todayStr.slice(0,4));
  if(!state.repMonth)state.repMonth=todayStr.slice(0,7);
  let start,end,periodoLbl="";
  if(state.rep==="semana"){
    const wks=weeksInYear(state.repYear);const curW=weekOfYear(todayStr);const selW=state.repWeek||curW;
    const wkObj=wks.find(w=>w.w===selW)||wks[wks.length-1];
    start=wkObj.start;end=wkObj.end;periodoLbl=`${wkObj.label} \u2014 ${fmtD(wkObj.start)} a ${fmtD(wkObj.end)}`;
  }else if(state.rep==="mes"){
    const r=monthRange(state.repMonth);start=r.start;end=r.end;
    periodoLbl=`${MESES_FULL[Number(state.repMonth.split("-")[1])-1]} / ${state.repMonth.split("-")[0]}`;
  }else if(state.rep==="ano"){
    const r=yearRange(state.repYear);start=r.start;end=r.end;periodoLbl=`Ano ${state.repYear}`;
  }else{
    start=state.repStart||today().slice(0,8)+"01";end=state.repEnd||today();periodoLbl="Per\u00edodo personalizado";
  }
  return {start:start,end:end,periodoLbl:periodoLbl};
}
/* Gera os controles de sele\u00e7\u00e3o de per\u00edodo (reaproveita IDs do wire) */
function weekOptionsHtml(){

    return `<div class="fg"><label>Ano</label><input type="number" id="rep_year" value="${state.repYear}" min="2020" max="2100" style="width:100px"></div>
      <div class="fg"><label>Semana</label><select id="rep_week">${wks.map(w=>`<option value="${w.w}" ${w.w===selW?"selected":""}>${w.label} \u00b7 ${fmtD(w.start)} a ${fmtD(w.end)}</option>`).join("")}</select></div>`;
  }else if(state.rep==="mes"){
    return `<div class="fg"><label>M\u00eas</label><input type="month" id="rep_month" value="${state.repMonth}"></div>`;
  }else if(state.rep==="ano"){

}

function _buscaDateRange(){
  var mode=state.buscaData||"tudo";
  var t=today();
  if(mode==="hoje") return {de:t,ate:t};
  if(mode==="semana"){
    var d=new Date(t+"T00:00:00");
    var day=d.getDay();
    var mon=new Date(d); mon.setDate(d.getDate()-(day===0?6:day-1));
    var sun=new Date(mon); sun.setDate(mon.getDate()+6);
    return {de:mon.toISOString().slice(0,10),ate:sun.toISOString().slice(0,10)};
  }
  if(mode==="mes"){
    var ym=t.slice(0,7);
    var last=new Date(parseInt(ym.slice(0,4)),parseInt(ym.slice(5,7)),0);
    return {de:ym+"-01",ate:last.toISOString().slice(0,10)};
  }
  if(mode==="custom") return {de:state.buscaDe||"",ate:state.buscaAte||""};
  return {de:"",ate:""};
}
/* ===== Verificar autenticidade de comprovante de EPI ===== */
function _verNorm(s){
  var n=String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(n&&n.indexOf("EPI")!==0)n="EPI"+n;
  return n;
}
function _verBuscar(codigo){
  var alvo=_verNorm(codigo);
  if(alvo.length<11)return [];
  return MOVS.filter(function(m){
    var c=m.codigo||"";
    if(!c&&m.obs){var mm=/\[COD:\s*([A-Z0-9\-]+)\]/i.exec(m.obs);if(mm)c=mm[1];}
    return c&&_verNorm(c)===alvo;
  });
}

/* Abre o comprovante pelo proprio app (PDF privado, sem pedir acesso ao Drive) */
async function _abrirPdfApp(mv){
  var w=null;
  try{w=window.open("","_blank");if(w)w.document.write("<p style='font-family:sans-serif;padding:20px'>Abrindo comprovante...</p>");}catch(e){}
  var r=await api("getReciboPdf",{movId:mv.id},true);
  if(r&&r.ok&&r.b64){
    var bin=atob(r.b64),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}));
    if(w){w.location.href=url;}
    else{var a=document.createElement("a");a.href=url;a.download=r.nome||"comprovante.pdf";document.body.appendChild(a);a.click();a.remove();}
    setTimeout(function(){URL.revokeObjectURL(url);},120000);
    return;
  }
  if(w){try{w.close();}catch(e){}}
  toast((r&&r.error)||"N\u00e3o foi poss\u00edvel abrir o comprovante.","erro");
}
async function _ver_abrirPdf(movId){
  var mv=MOVS.find(function(x){return x.id===movId;});
  if(!mv)return;
  if(mv.reciboRef){var ref=MOVS.find(function(x){return x.id===mv.reciboRef;});if(ref)mv=ref;}
  if(mv.reciboUrl){_abrirPdfApp(mv);return;}
  var r=await api("getRecibo",{movId:mv.id},true);
  if(r&&r.ok&&r.url){mv.reciboUrl=r.url;_abrirPdfApp(mv);return;}
  toast('PDF deste comprovante n\u00e3o foi localizado no Drive.',"warn");
}

    +'<style>body{font-family:Arial,sans-serif;font-size:11.5px;padding:20px;color:#1d2733}'
